site_name: IBM VPC File Pool CSI Driver
site_description: A Kubernetes CSI driver that pools multiple PVCs as subdirectories within shared VPC file shares
site_url: https://neil1taylor.github.io/ibm-vpc-file-pool-csi/
repo_url: https://github.com/neil1taylor/ibm-vpc-file-pool-csi
repo_name: neil1taylor/ibm-vpc-file-pool-csi

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: README.md
  - Getting Started:
      - Installation: INSTALL.md
      - User Guide: USER-GUIDE.md
      - Tutorial: TUTORIAL.md
      - Tutorial 1 - Pool Creation: TUTORIAL-01-POOL-CREATION.md
      - Tutorial 2 - Snapshots and Clones: TUTORIAL-02-SNAPSHOTS-AND-CLONES.md
      - Tutorial 3 - Group Snapshots and Hooks: TUTORIAL-03-GROUP-SNAPSHOTS-AND-HOOKS.md
      - Tutorial 4 - Pool Configuration: TUTORIAL-04-POOL-CONFIGURATION.md
      - Tutorial 5 - Golden Images: TUTORIAL-05-GOLDEN-IMAGES.md
      - Tutorial 6 - Replication and Failover: TUTORIAL-06-REPLICATION-AND-FAILOVER.md
      - Tutorial 7 - Monitoring: TUTORIAL-07-MONITORING.md
      - Tutorial 8 - Migration and Console: TUTORIAL-08-MIGRATION-AND-CONSOLE.md
      - Features: FEATURES.md
      - Upgrade Guide: UPGRADE-GUIDE.md
      - FAQ: FAQ.md
      - Helm Values Reference: HELM-VALUES.md
  - Operations:
      - Day 2 Operations: DAY2-OPERATIONS.md
      - Monitoring: MONITORING.md
      - Capacity Planning: CAPACITY-PLANNING.md
      - Backup and Recovery: BACKUP-RECOVERY.md
      - Golden Image Workflow: GOLDEN-IMAGE-WORKFLOW.md
      - Security: SECURITY.md
      - Troubleshooting: TROUBLESHOOTING.md
      - Performance Tuning: PERFORMANCE-TUNING.md
      - Known Limitations: KNOWN-LIMITATIONS.md
  - Architecture:
      - Overview: OVERVIEW.md
      - System Design: ARCHITECTURE.md
      - Consistency Model: CONSISTENCY-MODEL.md
      - VPC Networking: VPC-NETWORKING.md
      - VM Disk Formats: VM-DISK-FORMATS.md
      - CRD Specification: CRD-SPEC.md
      - CSI Interface: CSI-INTERFACE.md
      - IBM VPC API: IBM-VPC-API.md
      - API Key Setup: API-KEY-SETUP.md
  - Design (Phase 4):
      - Volume Cloning: VOLUME-CLONING.md
      - Volume Group Snapshots: VOLUME-GROUP-SNAPSHOTS.md
      - Cross-Region DR: CROSS-REGION-DR.md
  - Development:
      - Contributing: CONTRIBUTING.md
      - Coding Guidelines: CODING-GUIDELINES.md
      - Testing: TESTING.md
      - Changelog: CHANGELOG.md
  - Examples:
      - Overview: examples/README.md
