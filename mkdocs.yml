site_name: IBM VPC File Pool CSI Driver
site_description: A Kubernetes CSI driver that pools multiple PVCs as subdirectories within shared VPC file shares
site_url: https://neil1taylor.github.io/ibm-vpc-file-pool-csi/
repo_url: https://github.com/neil1taylor/ibm-vpc-file-pool-csi
repo_name: neil1taylor/ibm-vpc-file-pool-csi

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: README.md
  - Getting Started:
      - Installation: INSTALL.md
      - User Guide: USER-GUIDE.md
      - Helm Values Reference: HELM-VALUES.md
  - Operations:
      - Troubleshooting: TROUBLESHOOTING.md
      - Performance Tuning: PERFORMANCE-TUNING.md
      - Known Limitations: KNOWN-LIMITATIONS.md
  - Architecture:
      - System Design: ARCHITECTURE.md
      - VPC Networking: vpc-networking.md
      - CRD Specification: CRD-SPEC.md
      - CSI Interface: CSI-INTERFACE.md
      - IBM VPC API: IBM-VPC-API.md
      - API Key Setup: API-KEY-SETUP.md
  - Development:
      - Contributing: CONTRIBUTING.md
      - Coding Guidelines: CODING-GUIDELINES.md
      - Testing: TESTING.md
      - Changelog: CHANGELOG.md
  - Examples:
      - Overview: examples/README.md
