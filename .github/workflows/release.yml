name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-image:
    name: Build Release Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # NOTE: Registry secrets must be configured in repository settings:
      #   - REGISTRY_USERNAME: your container registry username
      #   - REGISTRY_PASSWORD: your container registry password or API key
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: icr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true  # Requires REGISTRY_USERNAME and REGISTRY_PASSWORD secrets
          tags: |
            icr.io/ibm-vpc-file-pool-csi/driver:${{ steps.version.outputs.VERSION }}
            icr.io/ibm-vpc-file-pool-csi/driver:latest
