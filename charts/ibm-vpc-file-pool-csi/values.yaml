nameOverride: ""
fullnameOverride: ""

image:
  repository: icr.io/ibm-vpc-file-pool-csi/driver
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  # Auto-discovered on managed ROKS/IKS clusters.
  # Only set these for unmanaged clusters or to override auto-discovery.
  region: ""      # Auto-discovered from secret provider endpoint
  vpcID: ""       # Auto-discovered from ibm-cloud-provider-data configmap
  subnetID: ""    # Auto-discovered from ibm-cloud-provider-data configmap
  resourceGroupID: ""

controller:
  replicas: 1
  healthPort: 8081
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  tolerations: []
  nodeSelector: {}
  affinity: {}

node:
  # Kubelet root directory. Standard Kubernetes uses /var/lib/kubelet.
  # ROKS (Red Hat OpenShift on IBM Cloud) uses /var/data/kubelet.
  kubeletDir: /var/lib/kubelet
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  tolerations:
    - operator: Exists
  nodeSelector: {}
  affinity: {}

cloneWorker:
  # Interval between clone worker poll cycles (Go duration string).
  interval: 10s

webhook:
  # Enable validating admission webhooks for CRD resources.
  enabled: true
  # Webhook server port (must match the Service targetPort).
  port: 9443
  # Certificate provisioning method: "cert-manager" or "manual".
  # cert-manager: auto-provisions TLS certs via cert-manager (must be installed).
  # manual: you must create the TLS secret yourself before deploying.
  certProvider: cert-manager
  # cert-manager issuer configuration (only used when certProvider=cert-manager).
  certManager:
    # Use a self-signed issuer by default.
    issuerKind: Issuer
    issuerName: ""  # Leave empty to create a self-signed Issuer automatically.

logLevel: 4

secretProvider:
  managed: true
  sidecar:
    image: icr.io/obs/armada-storage-secret:v1.2.75

sidecars:
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v1.12.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  snapshotter:
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.12.0
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
  liveness:
    image: registry.k8s.io/sig-storage/livenessprobe:v2.14.0
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

metrics:
  port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
  alerts:
    enabled: false
    utilizationWarning: 80
    utilizationCritical: 95

volumeSnapshotClass:
  create: true
  name: ibm-vpc-file-pool
  deletionPolicy: Delete

storageClass:
  create: true
  name: ibm-vpc-file-pool
  pool: general-purpose
  tier: ""  # Empty = default (no tier). Set to tier name when pool uses tiers.
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  allowVolumeExpansion: true
  mountOptions:
    - nfsvers=4.1
    - soft
    - timeo=600
    - retrans=3
