nameOverride: ""
fullnameOverride: ""

image:
  repository: de.icr.io/ibm-vpc-file-pool-csi/driver
  # Empty means "v" plus the chart appVersion (never "latest").
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  # Auto-discovered on managed ROKS/IKS clusters.
  # Only set these for unmanaged clusters or to override auto-discovery.
  region: ""      # Auto-discovered from secret provider endpoint
  vpcID: ""       # Auto-discovered from ibm-cloud-provider-data configmap
  subnetID: ""    # Comma-separated worker subnets; auto-discovered from ibm-cloud-provider-data configmap
  resourceGroupID: ""

controller:
  replicas: 1
  healthPort: 8081
  # Pod and container security contexts. The image runs as user 65532, so the
  # controller needs no root. Outside OpenShift the chart adds fsGroup 65532 so
  # the user can read the webhook key (mode 0400); OpenShift assigns its own,
  # except in kube-system, where no SCC applies and the chart adds it too.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]
  # Security context for the sidecar containers (provisioner, resizer,
  # snapshotter, liveness probe, secret provider). Their user is not changed.
  sidecarSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  tolerations: []
  nodeSelector: {}
  affinity: {}

node:
  # The node agent must run privileged as root: it mounts NFS on the host, and
  # the image itself now defaults to a non-root user.
  securityContext:
    privileged: true
    runAsUser: 0
  # Kubelet root directory. ROKS/IKS uses /var/data/kubelet (the real path).
  # /var/lib/kubelet is a symlink on ROKS, but kubelet sends CSI RPCs with
  # the resolved real path. The container mountPath MUST match the path
  # kubelet uses, otherwise NFS mounts created by the CSI driver won't
  # propagate to the host via Bidirectional mount propagation.
  # Standard (non-IBM) Kubernetes clusters use /var/lib/kubelet.
  kubeletDir: /var/data/kubelet
  # Port for the node-driver-registrar health endpoint.
  # Must not conflict with other hostNetwork services on the node.
  # Stock IBM VPC file CSI uses 9808; we default to 9809.
  registrarHealthPort: 9809
  # Port of the node agent's metrics endpoint (per-share used bytes, NFS latency
  # and IOPS). The node agent uses the host network, so the port must be free on
  # the node. 0 turns the endpoint off.
  metricsPort: 9810
  # How often the node agent reads the NFS statistics of its shares.
  shareStatsInterval: 30s
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  tolerations:
    - operator: Exists
  nodeSelector: {}
  affinity: {}

cloneWorker:
  # Interval between clone worker poll cycles (Go duration string).
  interval: 10s

goldenImageSyncer:
  # Interval between golden image syncer poll cycles (Go duration string).
  interval: 5m

# Browse a backup and restore single files (issue #92). The controller starts a
# read-only helper pod for each open session. The helper image is built from
# Dockerfile.browse.
backupBrowse:
  enabled: true
  # The namespace of browse sessions: their helper pods and Secrets. The chart
  # makes it. It holds nothing else, so the gateway's right to read Secrets there
  # reaches nothing else. It allows root pods without capabilities (the helper
  # reads backups made by other users); on OpenShift the chart adds one SCC.
  namespace: ibm-vpc-file-pool-csi-browse
  image:
    repository: de.icr.io/ibm-vpc-file-pool-csi/browse
    # Empty means the same tag as the driver image.
    tag: ""
  # A session ends after this long without use.
  idle: 15m
  # A session ends after this long, even if in use.
  maxLife: 2h
  # Open sessions in the cluster, and for the claims of one namespace. More wait.
  maxSessions: 5
  maxSessionsPerNamespace: 2
  # The most one file restore writes, in bytes (200 GiB). A restore of more is
  # refused before it starts.
  restoreMaxBytes: 214748364800
  # File restores that run at once in the cluster. More wait.
  restoreMaxRunning: 5
  # Browsing and restoring files from backups that a policy exported to COS
  # (policy spec.export). The helper pods that read COS run in the driver's own
  # namespace, next to the COS and Key Protect Secrets, so those keys are never
  # copied to the browse namespace, where the gateway may read Secrets. They run as
  # an ordinary user with no service account token.
  cos:
    enabled: true
    # Limits of the helper pod that reads COS. Empty means 1 CPU and 1Gi.
    cpuLimit: ""
    memoryLimit: ""
    # A session on COS ends if its helper is not ready after this long, usually
    # because a Secret named by the export block is missing.
    startTimeout: 5m

# The backup gateway: the one door to browse sessions (issue #92). Users talk
# to it with their own Kubernetes token; it checks every call with a token review
# and a SubjectAccessReview on the rights-only name "backupfiles". It needs
# backupBrowse.enabled.
backupGateway:
  enabled: true
  replicas: 1
  # The address users reach the gateway at, put in the ConfigMap
  # backup-gateway-info that "kubectl backup" reads. Empty uses
  # https://<route.host>, the host of an existing Route, or on a first install
  # on OpenShift the host the router will give the Route (from the cluster's
  # ingress domain); if none is known users pass --gateway.
  url: ""
  tls:
    # Empty: on OpenShift the service CA makes the certificate. Elsewhere you
    # must name a Secret (tls.crt, tls.key) that holds the gateway's serving
    # certificate, or the gateway pod cannot start.
    secretName: ""
  # A reencrypt Route, made only where the OpenShift Route API exists. The router
  # answers with its own certificate for the host, then encrypts again to the gateway.
  route:
    enabled: true
    # Empty lets OpenShift choose the host.
    host: ""
  # How long a request that asks to wait (?wait=true) holds for the helper pod to
  # be ready. Keep it under the proxy timeout (the OpenShift router cuts a request
  # after 30 seconds). kubectl backup does not ask to wait: it polls.
  sessionWait: 20s
  # The largest single file or tar a user may download.
  maxDownloadBytes: 53687091200
  # File restores one user may have that have not ended. More are refused.
  maxOpenRestores: 10
poolBench:
  # PoolBench runs storage performance tests with test VMs, started from the
  # console (docs/specs/2026-10-25-poolbench.md). Each run makes its own
  # namespace and pool and deletes them at the end. Off by default: when on,
  # the service may make namespaces, pools and VMs.
  enabled: false
  # Time between two passes of the runner.
  interval: 15s
  # The raw results of the test VMs, kept until a run is deleted.
  results:
    size: 5Gi
    # Empty uses the cluster's default storage class.
    storageClass: ""
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

cdi:
  # The controller keeps the memory limit of CDI's copy pods (OpenShift
  # Virtualization HyperConverged spec.resourceRequirements.storageWorkloads)
  # at least this high. CDI's default of 600M is too small for copies onto
  # NFS, and 2Gi failed for a 25 GB disk. Empty turns the check off.
  copyPodMemoryLimit: 8Gi

vmSnapshots:
  # How snapshots of KubeVirt VM disks are made. See docs/VM-INSTANT-SNAPSHOTS.md.
  # auto: instant snapshots (a new overlay file per snapshot, nothing copied)
  #   where the KubeVirt Sidecar feature gate is on, and a copy elsewhere. It
  #   adds a webhook that gives each VM with snapshots a hook when it starts.
  #   Red Hat does not support the Sidecar feature gate.
  # copy: every VM disk snapshot is a copy.
  method: auto
  # KubeVirt's virt-launcher image, for the Jobs that change a stopped VM's
  # snapshot files. Empty reads it from the virt-operator Deployment.
  launcherImage: ""
  # Turn on the KubeVirt Sidecar feature gate, which instant snapshots need,
  # with a hook Job after each install and upgrade. It adds one entry to the
  # HyperConverged kubevirt.kubevirt.io/jsonpatch annotation and keeps the
  # others. Red Hat does not support settings made through that annotation.
  # Setting this back to false or uninstalling does not turn the gate off: VMs
  # with instant snapshots cannot start without it. To turn it off, flatten
  # those VMs first (kubectl pool-snapshots flatten), then remove the entry.
  # The gate is cluster-wide: anyone who can create or edit a VM can then add
  # a hook sidecar container to that VM's pod. The hook Job may only read and
  # update the HyperConverged object named kubevirt-hyperconverged.
  enableSidecarGate: false

webhook:
  # Enable validating admission webhooks for CRD resources.
  enabled: true
  # Webhook server port (must match the Service targetPort).
  port: 9443
  # Certificate provisioning method: "cert-manager", "openshift" or "manual".
  # cert-manager: auto-provisions TLS certs via cert-manager (must be installed).
  # openshift: uses the built-in OpenShift service CA. No extra operator needed.
  #   Use this on ROKS and ROVS clusters that do not have cert-manager.
  # manual: you must create the TLS secret <release>-ibm-vpc-file-pool-csi-webhook-certs
  #   yourself before deploying, and set caBundle to the base64-encoded CA that signed it.
  certProvider: cert-manager
  # Base64-encoded PEM CA bundle for the webhook config. Required when certProvider=manual.
  caBundle: ""
  # cert-manager issuer configuration (only used when certProvider=cert-manager).
  certManager:
    # Use a self-signed issuer by default.
    issuerKind: Issuer
    issuerName: ""  # Leave empty to create a self-signed Issuer automatically.

logLevel: 4

secretProvider:
  managed: true
  sidecar:
    image: icr.io/obs/armada-storage-secret:v1.2.75

sidecars:
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v1.12.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  snapshotter:
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.12.0
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
  liveness:
    image: registry.k8s.io/sig-storage/livenessprobe:v2.14.0
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

metrics:
  port: 8080
  serviceMonitor:
    # Created only when the cluster has the Prometheus Operator API
    # (OpenShift has it). The console plugin's charts read these metrics.
    enabled: true
    interval: 30s
  # Where scraping and alerts live on OpenShift. Platform monitoring reads only
  # namespaces labelled openshift.io/cluster-monitoring=true, and Red Hat says not to
  # label other namespaces or to put your own ServiceMonitors in kube-*. So the chart
  # makes its own namespace for the ServiceMonitors, the PrometheusRule and Services
  # whose Endpoints the controller keeps. OpenShift's user workload monitoring must be
  # on (enableUserWorkload: true in openshift-monitoring/cluster-monitoring-config);
  # the chart never changes that. See docs/MONITORING.md.
  monitoring:
    # auto: use it when the cluster has the Prometheus Operator API and the OpenShift
    # console and webhook.certProvider=openshift. enabled: always (needs certProvider
    # openshift). disabled: ServiceMonitors and rules stay in the release namespace.
    mode: auto
    namespace: ibm-vpc-file-pool-csi-monitoring
  # The service account that scrapes the node agents' metrics (they need a token
  # that may "get" /metrics). The defaults are OpenShift's Prometheus. Empty
  # serviceAccount creates no binding; then bind the chart's metrics-reader role yourself.
  scraper:
    serviceAccount: prometheus-k8s
    namespace: openshift-monitoring
  alerts:
    # Created only when the cluster has the Prometheus Operator API.
    enabled: true
    # Pool use, in percent of capacity
    utilizationWarning: 80
    utilizationCritical: 95
    # One share, in percent of its size allocated to PVCs
    shareUtilizationWarning: 90
    # One share, in percent of its size written (real used bytes, from the node agents)
    shareUsedWarning: 85
    shareUsedCritical: 95
    # NFS requests on one share (read or write): average seconds per request.
    # Judged only while the share does at least nfsMinOpsPerSecond requests a second.
    nfsLatencySeconds: 0.1
    nfsMinOpsPerSecond: 1
    # Read and write operations a second on one share, all nodes together.
    # 0 turns the alert off. Set it near the IOPS of the share profile.
    shareIOPSWarning: 0
    # Failed volume allocations per second
    allocationFailuresPerSecond: 0.1
    # Slowest 1% of volume allocations, in seconds
    allocationP99Seconds: 5
    # Failed VPC API calls per second
    apiErrorsPerSecond: 0.05
    # Replication: seconds behind, and failures in a row
    replicationLagSeconds: 7200
    replicationFailures: 3
    # Backups: a volume with no backup for this long (twice the schedule is a good value)
    backupLateSeconds: 43200
    # Copy in COS: the newest export, or a moment waiting, this old
    exportLateSeconds: 43200
    # Snapshot pool share use, in percent. New backups stop at 85.
    snapshotPoolWarning: 75
    snapshotPoolCritical: 85

volumeSnapshotClass:
  create: true
  name: ibm-vpc-file-pool
  deletionPolicy: Delete

storageClass:
  create: true
  name: ibm-vpc-file-pool
  pool: general-purpose
  tier: ""  # Empty = default (no tier). Set to tier name when pool uses tiers.
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  allowVolumeExpansion: true
  mountOptions:
    - nfsvers=4.1
    - soft
    - timeo=600
    - retrans=3

replicationReceiver:
  # Enable the replication receiver for driver-to-driver cross-region replication.
  # Deploy this on the DESTINATION cluster. Source cluster Jobs upload data via HTTPS.
  enabled: false
  # PVC name for the destination NFS share (must be pre-created).
  pvcName: ""
  # Secret name containing a "token" key for bearer token authentication.
  authSecretName: ""
  # User and group the receiver runs as. It writes the destination VM disks, and
  # KubeVirt runs QEMU as 107, so a failed-over VM can open a disk only if 107
  # owns it.
  runAsUser: 107
  runAsGroup: 107
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  # Memory: the receiver itself needs about 100 MiB. Pages of files on NFS count
  # against the limit and the kernel drops them as it needs room, so the memory
  # use of a busy receiver stays near the limit; that is normal. It forces its
  # data out and drops cached pages, so a 512Mi limit also survived the send of
  # an 11 GiB VM disk in a lab test. 1Gi leaves room.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # TLS configuration for the receiver HTTPS endpoint.
  tls:
    # Enable native TLS on the receiver (certificates provisioned by cert-manager).
    # Off by default: it needs cert-manager and a CA the source cluster trusts. On OpenShift the
    # Route already encrypts traffic into the cluster. Turn it on without a Route. See SECURITY.md.
    enabled: false
    # Extra DNS SANs for the receiver TLS certificate (e.g. custom ingress hostnames).
    # On OpenShift, the Route hostname is added automatically via cluster ingress lookup.
    additionalDNSNames: []
    certManager:
      # Issuer kind: "Issuer" (namespace-scoped) or "ClusterIssuer".
      issuerKind: Issuer
      # Issuer name. Empty = create a self-signed Issuer automatically.
      issuerName: ""

replication:
  # Override the container image used for replication Jobs.
  # When empty, receiver-mode Jobs use the driver image; direct-NFS Jobs use CentOS.
  image: ""

consolePlugin:
  # The OpenShift Console dynamic plugin for visual pool management.
  # Installed only on clusters with the OpenShift console (ConsolePlugin v1
  # API, OpenShift 4.14+). A hook Job turns it on in the console; set false to
  # leave it out (an upgrade then turns it off in the console).
  enabled: true
  image:
    repository: de.icr.io/ibm-vpc-file-pool-csi/console-plugin
    # Empty means "v" plus the chart appVersion (never "latest").
    tag: ""
  # The image already runs as user 1001 (nginx).
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  replicas: 2
  # HTTPS port for the plugin Service. TLS certs are auto-provisioned
  # by the OpenShift service-ca operator.
  port: 9443
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
    limits:
      memory: 128Mi
