apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-controller
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
rules:
  # CRD access
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["filesharepools", "filesharepools/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["subvolumes", "subvolumes/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # PV/PVC read access
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Secrets (for IBM Cloud API key)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # ConfigMaps (for cluster config)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # CSI node info
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  # Storage classes
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-controller
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
