apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "ibm-vpc-file-pool-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "ibm-vpc-file-pool-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-controller
      {{- $podSC := deepCopy (.Values.controller.podSecurityContext | default dict) }}
      {{- $fixedIDs := or (not (.Capabilities.APIVersions.Has "security.openshift.io/v1")) (eq .Release.Namespace "kube-system") }}
      {{- if and $fixedIDs (not (hasKey $podSC "fsGroup")) }}
      {{- $_ := set $podSC "fsGroup" 65532 }}
      {{- end }}
      {{- $sidecarSC := deepCopy (.Values.controller.sidecarSecurityContext | default dict) }}
      {{- if and $fixedIDs (not (hasKey $sidecarSC "runAsUser")) }}
      {{- $_ := set $sidecarSC "runAsUser" 65532 }}
      {{- end }}
      securityContext:
        {{- toYaml $podSC | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: csi-controller
          image: "{{ include "ibm-vpc-file-pool-csi.driverImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.controller.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "--mode=controller"
            - "--endpoint=unix:///csi/csi.sock"
            - "--v={{ .Values.logLevel }}"
            {{- if .Values.config.region }}
            - "--region={{ .Values.config.region }}"
            {{- end }}
            {{- if .Values.config.vpcID }}
            - "--vpc-id={{ .Values.config.vpcID }}"
            {{- end }}
            {{- if .Values.config.subnetID }}
            - "--subnet-id={{ .Values.config.subnetID }}"
            {{- end }}
            - "--kubelet-dir={{ .Values.node.kubeletDir }}"
            {{- if .Values.cloneWorker.interval }}
            - "--clone-worker-interval={{ .Values.cloneWorker.interval }}"
            {{- end }}
            {{- if .Values.goldenImageSyncer.interval }}
            - "--golden-image-sync-interval={{ .Values.goldenImageSyncer.interval }}"
            {{- end }}
            - "--cdi-copy-pod-memory-limit={{ .Values.cdi.copyPodMemoryLimit }}"
            - "--driver-image={{ include "ibm-vpc-file-pool-csi.driverImage" . }}"
            {{- if .Values.backupBrowse.enabled }}
            - "--browse-image={{ .Values.backupBrowse.image.repository }}:{{ .Values.backupBrowse.image.tag | default (include "ibm-vpc-file-pool-csi.imageTag" .) }}"
            {{- if .Values.imagePullSecrets }}
            - "--browse-image-pull-secrets={{ range $i, $s := .Values.imagePullSecrets }}{{ if $i }},{{ end }}{{ $s.name }}{{ end }}"
            {{- end }}
            - "--browse-namespace={{ .Values.backupBrowse.namespace }}"
            - "--browse-idle={{ .Values.backupBrowse.idle }}"
            - "--browse-max-life={{ .Values.backupBrowse.maxLife }}"
            - "--browse-max-sessions={{ .Values.backupBrowse.maxSessions }}"
            - "--browse-max-sessions-per-namespace={{ .Values.backupBrowse.maxSessionsPerNamespace }}"
            {{- end }}
            {{- if not (has .Values.vmSnapshots.method (list "auto" "copy")) }}
            {{- fail "vmSnapshots.method must be auto or copy" }}
            {{- end }}
            - "--vm-snapshot-method={{ .Values.vmSnapshots.method }}"
            {{- with .Values.vmSnapshots.launcherImage }}
            - "--virt-launcher-image={{ . }}"
            {{- end }}
            - "--metrics-cert-dir=/etc/metrics-certs"
            {{- if .Values.node.metricsPort }}
            # The copy of a running VM's disks follows the load on the share, read from the node agents.
            - "--node-metrics-service={{ include "ibm-vpc-file-pool-csi.fullname" . }}-node-metrics"
            - "--node-metrics-account={{ include "ibm-vpc-file-pool-csi.fullname" . }}-node-reader"
            - "--node-metrics-ca=/etc/node-metrics-ca/{{ ternary "service-ca.crt" "ca.crt" (eq .Values.webhook.certProvider "openshift") }}"
            {{- end }}
            {{- if include "ibm-vpc-file-pool-csi.uwm" . }}
            - "--monitoring-namespace={{ .Values.metrics.monitoring.namespace }}"
            - "--monitoring-controller-service={{ include "ibm-vpc-file-pool-csi.fullname" . }}-metrics"
            - "--monitoring-controller-port={{ .Values.metrics.port }}"
            - "--monitoring-node-service={{ include "ibm-vpc-file-pool-csi.fullname" . }}-node-metrics"
            - "--monitoring-node-port={{ .Values.node.metricsPort }}"
            {{- if .Values.poolBench.enabled }}
            - "--monitoring-poolbench-service={{ include "ibm-vpc-file-pool-csi.fullname" . }}-poolbench"
            - "--monitoring-poolbench-port=8443"
            {{- end }}
            - "--monitoring-selector=app.kubernetes.io/name={{ include "ibm-vpc-file-pool-csi.name" . }},app.kubernetes.io/instance={{ .Release.Name }}"
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - "--webhook-port={{ .Values.webhook.port }}"
            {{- else }}
            - "--enable-webhooks=false"
            {{- end }}
            {{- if .Values.secretProvider.managed }}
            - "--sidecarEndpoint=/csi/providerfile.sock"
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: healthz
              containerPort: {{ .Values.controller.healthPort }}
              protocol: TCP
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 30
            failureThreshold: 3
          {{- if .Values.secretProvider.managed }}
          env:
            - name: IKS_ENABLED
              value: "True"
            - name: SECRET_CONFIG_PATH
              value: /etc/storage_ibmc
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: metrics-certs
              mountPath: /etc/metrics-certs
              readOnly: true
            {{- if .Values.node.metricsPort }}
            - name: node-ca
              mountPath: /etc/node-metrics-ca
              readOnly: true
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
            {{- if .Values.secretProvider.managed }}
            - name: customer-auth
              mountPath: /etc/storage_ibmc
              readOnly: true
            - name: cluster-info
              mountPath: /etc/storage_ibmc/cluster_info
              readOnly: true
            - name: vault-token
              mountPath: /var/run/secrets/tokens
            {{- end }}
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        - name: csi-provisioner
          image: {{ .Values.sidecars.provisioner.image }}
          {{- with $sidecarSC }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "--csi-address=/csi/csi.sock"
            - "--feature-gates=Topology=true"
            - "--extra-create-metadata"
            - "--leader-election"
            - "--leader-election-namespace={{ .Release.Namespace }}"
            - "--timeout=300s"
            - "--retry-interval-start=5s"
            - "--http-endpoint=:9809"
          livenessProbe:
            httpGet:
              path: /healthz/leader-election
              port: 9809
            periodSeconds: 30
            failureThreshold: 3
          {{- with .Values.sidecars.provisioner.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: csi-resizer
          image: {{ .Values.sidecars.resizer.image }}
          {{- with $sidecarSC }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "--csi-address=/csi/csi.sock"
            - "--leader-election"
            - "--leader-election-namespace={{ .Release.Namespace }}"
            - "--timeout=300s"
            - "--http-endpoint=:9810"
          livenessProbe:
            httpGet:
              path: /healthz/leader-election
              port: 9810
            periodSeconds: 30
            failureThreshold: 3
          {{- with .Values.sidecars.resizer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: csi-snapshotter
          image: {{ .Values.sidecars.snapshotter.image }}
          {{- with $sidecarSC }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "--csi-address=/csi/csi.sock"
            - "--leader-election"
            - "--leader-election-namespace={{ .Release.Namespace }}"
            - "--timeout=300s"
            - "--http-endpoint=:9811"
          livenessProbe:
            httpGet:
              path: /healthz/leader-election
              port: 9811
            periodSeconds: 30
            failureThreshold: 3
          {{- with .Values.sidecars.snapshotter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: liveness-probe
          image: {{ .Values.sidecars.liveness.image }}
          {{- with $sidecarSC }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "--csi-address=/csi/csi.sock"
          {{- with .Values.sidecars.liveness.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        {{- if .Values.secretProvider.managed }}
        - name: storage-secret-sidecar
          image: {{ .Values.secretProvider.sidecar.image }}
          {{- with $sidecarSC }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "--endpoint=$(ENDPOINT)"
          env:
            - name: ENDPOINT
              value: "unix:/sidecardir/providerfile.sock"
          livenessProbe:
            exec:
              command: [test, -S, /sidecardir/providerfile.sock]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: socket-dir
              mountPath: /sidecardir
            - name: customer-auth
              mountPath: /etc/storage_ibmc
              readOnly: true
            - name: vault-token
              mountPath: /var/run/secrets/tokens
        {{- end }}

      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: metrics-certs
          secret:
            secretName: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-metrics-certs
            defaultMode: 0400
        {{- if .Values.node.metricsPort }}
        - name: node-ca
          {{- if eq .Values.webhook.certProvider "openshift" }}
          configMap:
            name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-node-ca
          {{- else }}
          secret:
            secretName: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-node-metrics-certs
            items:
              - key: ca.crt
                path: ca.crt
          {{- end }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - name: webhook-certs
          secret:
            secretName: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-webhook-certs
            defaultMode: 0400
        {{- end }}
        {{- if .Values.secretProvider.managed }}
        - name: customer-auth
          secret:
            secretName: storage-secret-store
        - name: cluster-info
          configMap:
            name: cluster-info
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: vault-token
                  expirationSeconds: 600
        {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
