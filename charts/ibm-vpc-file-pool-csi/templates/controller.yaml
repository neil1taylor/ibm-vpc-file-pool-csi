apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "ibm-vpc-file-pool-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "ibm-vpc-file-pool-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-controller
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: csi-controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--mode=controller"
            - "--endpoint=unix:///csi/csi.sock"
            - "--region={{ .Values.config.region }}"
            - "--v={{ .Values.logLevel }}"
            {{- if .Values.secretProvider.managed }}
            - "--sidecarEndpoint=/csi/providerfile.sock"
            {{- end }}
          {{- if .Values.secretProvider.managed }}
          env:
            - name: IKS_ENABLED
              value: "True"
            - name: SECRET_CONFIG_PATH
              value: /etc/storage_ibmc
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            {{- if .Values.secretProvider.managed }}
            - name: customer-auth
              mountPath: /etc/storage_ibmc
              readOnly: true
            - name: cluster-info
              mountPath: /etc/storage_ibmc/cluster_info
              readOnly: true
            - name: vault-token
              mountPath: /var/run/secrets/tokens
            {{- end }}
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        - name: csi-provisioner
          image: {{ .Values.sidecars.provisioner.image }}
          args:
            - "--csi-address=/csi/csi.sock"
            - "--feature-gates=Topology=true"
            - "--leader-election"
            - "--leader-election-namespace={{ .Release.Namespace }}"
            - "--timeout=300s"
            - "--retry-interval-start=5s"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: csi-resizer
          image: {{ .Values.sidecars.resizer.image }}
          args:
            - "--csi-address=/csi/csi.sock"
            - "--leader-election"
            - "--leader-election-namespace={{ .Release.Namespace }}"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: liveness-probe
          image: {{ .Values.sidecars.liveness.image }}
          args:
            - "--csi-address=/csi/csi.sock"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        {{- if .Values.secretProvider.managed }}
        - name: storage-secret-sidecar
          image: {{ .Values.secretProvider.sidecar.image }}
          args:
            - "--endpoint=$(ENDPOINT)"
          env:
            - name: ENDPOINT
              value: "unix:/sidecardir/providerfile.sock"
          volumeMounts:
            - name: socket-dir
              mountPath: /sidecardir
            - name: customer-auth
              mountPath: /etc/storage_ibmc
              readOnly: true
            - name: vault-token
              mountPath: /var/run/secrets/tokens
        {{- end }}

      volumes:
        - name: socket-dir
          emptyDir: {}
        {{- if .Values.secretProvider.managed }}
        - name: customer-auth
          secret:
            secretName: storage-secret-store
        - name: cluster-info
          configMap:
            name: cluster-info
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: vault-token
                  expirationSeconds: 600
        {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
