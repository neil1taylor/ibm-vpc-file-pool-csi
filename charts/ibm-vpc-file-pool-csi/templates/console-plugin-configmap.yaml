{{- if .Values.consolePlugin.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-console-plugin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-plugin
data:
  nginx.conf: |
    error_log /dev/stderr;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        access_log /dev/stdout;
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        client_body_temp_path /tmp/client_body;
        proxy_temp_path /tmp/proxy;
        fastcgi_temp_path /tmp/fastcgi;
        uwsgi_temp_path /tmp/uwsgi;
        scgi_temp_path /tmp/scgi;

        server {
            listen {{ .Values.consolePlugin.port }} ssl;
            ssl_certificate /var/cert/tls.crt;
            ssl_certificate_key /var/cert/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;

            root /opt/app-root/src;

            location / {
                try_files $uri $uri/ =404;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }

            location /health {
                access_log off;
                return 200 "OK";
                add_header Content-Type text/plain;
            }
        }
    }
{{- end }}
