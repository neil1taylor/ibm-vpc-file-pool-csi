apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
{{- if .Values.replicationReceiver.enabled }}
---
# The replication receiver takes data from outside the cluster and never calls
# the Kubernetes API, so it has an account of its own with no rights and no token.
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: false
metadata:
  name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: replication-receiver
{{- end }}
