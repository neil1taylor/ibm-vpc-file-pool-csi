apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "ibm-vpc-file-pool-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        {{- include "ibm-vpc-file-pool-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-node
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: csi-node
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--mode=node"
            - "--endpoint=unix:///csi/csi.sock"
            - "--node-id=$(NODE_NAME)"
            - "--v={{ .Values.logLevel }}"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          startupProbe:
            exec:
              command: [test, -S, /csi/csi.sock]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            exec:
              command: [test, -S, /csi/csi.sock]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [test, -S, /csi/csi.sock]
            periodSeconds: 30
            failureThreshold: 3
          {{- with .Values.node.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: {{ .Values.node.kubeletDir }}
              mountPropagation: Bidirectional

        - name: node-driver-registrar
          image: {{ .Values.sidecars.registrar.image }}
          args:
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path={{ .Values.node.kubeletDir }}/plugins/vpc-file-pool.csi.ibm.io/csi.sock"
            - "--http-endpoint=:{{ .Values.node.registrarHealthPort }}"
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.node.registrarHealthPort }}
            periodSeconds: 30
            failureThreshold: 3
          {{- with .Values.sidecars.registrar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration

      volumes:
        - name: socket-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins/vpc-file-pool.csi.ibm.io
            type: DirectoryOrCreate
        - name: kubelet-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}
            type: Directory
        - name: registration-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins_registry
            type: Directory
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
