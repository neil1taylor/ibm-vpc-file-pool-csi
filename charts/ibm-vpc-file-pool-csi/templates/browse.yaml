{{- if .Values.backupBrowse.enabled }}
{{- $ns := .Values.backupBrowse.namespace }}
{{- $fullname := include "ibm-vpc-file-pool-csi.fullname" . }}
# Browse sessions run in their own namespace, which holds nothing else: the
# helper pods and one Secret for each session (a token and a certificate). The
# gateway may read Secrets only here, so a compromised gateway cannot reach the
# driver's own Secrets in {{ .Release.Namespace }}. The helper reads backups made
# by other users, so it runs as root with every capability dropped, which the
# "baseline" level allows and "restricted" does not.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
# The controller makes and deletes the session Secrets, and keeps copies of the
# image pull Secrets, here only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-browse
  namespace: {{ $ns }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-browse
  namespace: {{ $ns }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-browse
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-controller
    namespace: {{ .Release.Namespace }}
---
# Only the backup gateway may reach a helper pod, and only on the helper's
# port. A helper holds another namespace's files, so no other pod may talk to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-browse
  namespace: {{ $ns }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: storage.ibmcloud.io/browse
        operator: Exists
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ibm-vpc-file-pool-csi.name" . }}
              app.kubernetes.io/component: backup-gateway
      ports:
        - protocol: TCP
          port: 8443
{{- if .Values.backupBrowse.cos.enabled }}
---
# A backup in COS is read by a helper pod in the driver's own namespace, where the
# COS and Key Protect Secrets are (a pod mounts only Secrets of its own namespace).
# The controller keeps a copy of each session's token and certificate there, for
# the helper to mount. It may make and delete Secrets in this namespace; it reads
# the others' metadata only. The gateway has no right to read Secrets here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-browse-cos
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-browse-cos
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-browse-cos
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-controller
    namespace: {{ .Release.Namespace }}
---
# Only the backup gateway may reach a helper pod that reads COS, and only on the
# helper's port. The policy selects the helper pods by their label and nothing
# else in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-browse-cos
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: storage.ibmcloud.io/browse
        operator: Exists
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ibm-vpc-file-pool-csi.name" . }}
              app.kubernetes.io/component: backup-gateway
      ports:
        - protocol: TCP
          port: 8443
{{- end }}
{{- if .Capabilities.APIVersions.Has "security.openshift.io/v1" }}
---
# On OpenShift the helper pod needs to run as root. This SCC allows that and
# nothing else: no capability, no privilege escalation, no host path. It is given
# to the default account of the browse namespace only.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ $fullname }}-browse
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - ALL
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
users:
  - system:serviceaccount:{{ $ns }}:default
{{- end }}
{{- end }}
