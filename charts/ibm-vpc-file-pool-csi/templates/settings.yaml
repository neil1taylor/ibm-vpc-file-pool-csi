# Settings the console shows. They are Helm values, not driver state, and hold
# no secret. The name is fixed because the console looks for exactly this name.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ibm-vpc-file-pool-csi-settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
data:
  vmSnapshotMethod: {{ .Values.vmSnapshots.method | quote }}
---
# Ordinary console users cannot read ConfigMaps in this namespace. This Role lets
# every signed-in user get this one ConfigMap by name, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ibm-vpc-file-pool-csi-settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - ibm-vpc-file-pool-csi-settings
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ibm-vpc-file-pool-csi-settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ibm-vpc-file-pool-csi-settings
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:authenticated
