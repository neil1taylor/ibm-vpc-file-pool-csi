{{- if include "ibm-vpc-file-pool-csi.consolePlugin" . }}
apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: ibm-vpc-file-pool-csi
  labels:
    {{- include "ibm-vpc-file-pool-csi.labels" . | nindent 4 }}
spec:
  displayName: IBM VPC File Pool CSI
  backend:
    type: Service
    service:
      name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-console-plugin
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.consolePlugin.port }}
      basePath: /
  i18n:
    loadType: Preload
  {{- $gateway := and .Values.backupGateway.enabled .Values.backupBrowse.enabled }}
  {{- if or .Values.poolBench.enabled $gateway }}
  proxy:
  {{- if .Values.poolBench.enabled }}
    # The PoolBench pages read a run's raw results from the PoolBench service, with
    # the person's own token; the service checks that they may get the run.
    - alias: poolbench
      authorization: UserToken
      endpoint:
        type: Service
        service:
          name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-poolbench
          namespace: {{ .Release.Namespace }}
          port: 8444
  {{- end }}
  {{- if $gateway }}
    # The file browser of the Backups pages talks to the backup gateway with the
    # person's own token. The gateway checks it and the person's right to read the
    # backups of the volume's namespace on every call. The browser never holds
    # any other credential.
    - alias: backup-gateway
      authorization: UserToken
      endpoint:
        type: Service
        service:
          name: {{ include "ibm-vpc-file-pool-csi.fullname" . }}-gateway
          namespace: {{ .Release.Namespace }}
          port: 8443
  {{- end }}
  {{- end }}
{{- end }}
