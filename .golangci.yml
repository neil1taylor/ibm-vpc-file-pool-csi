version: "2"
formatters:
  enable:
    - gofmt
    - goimports
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gosec
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        # Reorders struct fields to save memory; not a correctness check.
        - fieldalignment
    gosec:
      excludes:
        - G104
  exclusions:
    rules:
      # File permissions and paths in test fixtures carry no risk.
      - path: _test\.go
        linters:
          - gosec
