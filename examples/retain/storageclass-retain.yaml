# Retain StorageClass — subdirectory data is kept on the share after PVC deletion.
# Useful when data must be preserved for compliance or manual migration.
# Kubernetes keeps the PersistentVolume, and the SubVolume CR and subdirectory stay too.
# Capacity stays allocated. Clean up by hand when the data is no longer needed.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ibm-vpc-file-pool-retain
provisioner: vpc-file-pool.csi.ibm.io
parameters:
  pool: general-purpose
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  - soft
  - timeo=600
  - retrans=3
