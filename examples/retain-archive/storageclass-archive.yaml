# Archive StorageClass — subdirectory data is moved to .archived/ on PVC deletion.
# The subdirectory is renamed to .archived/<pvc-name>-<timestamp>/ on the share.
# Useful for accidental deletion recovery — data is preserved but capacity is freed
# from the pool's allocation tracking.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ibm-vpc-file-pool-archive
provisioner: vpc-file-pool.csi.ibm.io
parameters:
  pool: general-purpose
  reclaimAction: archive
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  - soft
  - timeo=600
  - retrans=3
