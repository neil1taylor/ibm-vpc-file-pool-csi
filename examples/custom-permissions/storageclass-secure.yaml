# Restricted StorageClass — specific UID/GID with tight permissions.
# The subdirectory is owned by nobody:nogroup (65534) with mode 0700,
# preventing access by other users on the same node.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ibm-vpc-file-pool-secure
provisioner: vpc-file-pool.csi.ibm.io
parameters:
  pool: general-purpose
  uid: "65534"
  gid: "65534"
  permissions: "0700"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  - soft
  - timeo=600
  - retrans=3
