# StorageClass for the standard performance tier.
# Suitable for configs, logs, and general application data.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ibm-vpc-file-pool-standard
provisioner: vpc-file-pool.csi.ibm.io
parameters:
  pool: tiered-pool
  tier: standard
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  - soft
  - timeo=600
  - retrans=3
