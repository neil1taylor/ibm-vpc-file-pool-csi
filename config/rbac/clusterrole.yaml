apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ibm-vpc-file-pool-csi-controller
rules:
  # CRD access
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["filesharepools", "filesharepools/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["subvolumes", "subvolumes/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["snapshots", "snapshots/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["replicationpolicies", "replicationpolicies/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["volumegroupsnapshots", "volumegroupsnapshots/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pod access for lifecycle hook execution (ExecHook)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # VolumeSnapshot CRDs (for csi-snapshotter sidecar)
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  # PV/PVC access (CSI provisioner creates PVs and updates PVC status)
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  # Secrets (for IBM Cloud API key and sidecar secret watcher)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "watch", "list"]
  # ConfigMaps (for cluster config)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # Nodes (for CSI topology)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # CSI node info
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  # Storage classes
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch", "create"]
  # CDI StorageProfile access (optional — only used when CDI/KubeVirt is installed)
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["storageprofiles"]
    verbs: ["get", "patch"]
  # CDI DataImportCrons (golden image discovery)
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["dataimportcrons"]
    verbs: ["get", "list", "watch"]
  # CDI DataSources (InstanceTypes catalog visibility)
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datasources"]
    verbs: ["get", "create"]
  # Jobs for golden image conversion
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # OpenShift ImageStreams (resolving golden image sources for RHEL)
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams"]
    verbs: ["get"]
  # RoleBindings for image-puller access (converter Jobs pulling from internal registry)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "create"]
  # OpenShift Templates for VM catalog
  - apiGroups: ["template.openshift.io"]
    resources: ["templates"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ibm-vpc-file-pool-csi-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ibm-vpc-file-pool-csi-controller
subjects:
  - kind: ServiceAccount
    name: ibm-vpc-file-pool-csi-controller
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ibm-vpc-file-pool-csi-node
rules:
  # Node read access (for zone detection)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  # SubVolume read access (for clone gate in NodePublishVolume and per-PVC stats)
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["subvolumes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ibm-vpc-file-pool-csi-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ibm-vpc-file-pool-csi-node
subjects:
  - kind: ServiceAccount
    name: ibm-vpc-file-pool-csi-node
    namespace: kube-system
