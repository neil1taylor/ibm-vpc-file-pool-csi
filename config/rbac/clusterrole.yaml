apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ibm-vpc-file-pool-csi-controller
rules:
  # CRD access
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["filesharepools", "filesharepools/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["subvolumes", "subvolumes/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["snapshots", "snapshots/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["replicationpolicies", "replicationpolicies/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["volumegroupsnapshots", "volumegroupsnapshots/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["backuppolicies", "backuppolicies/status", "backuppolicies/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["backuprestores", "backuprestores/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Backup policies back up a VM whole: they read the VM's volumes to find
  # all of its disks.
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "list"]
  # Pod access for lifecycle hook execution (ExecHook)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # VM moves: replication cancels a running VM disk copy when a live
  # migration is requested, because QEMU cannot migrate during a copy.
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstancemigrations"]
    verbs: ["list"]
  # Instant VM snapshots (docs/VM-INSTANT-SNAPSHOTS.md): the controller reads the
  # Sidecar feature gate and a stopped VM's disks, records each disk's
  # newest snapshot file on the running VMI, and keeps the hook script in a
  # ConfigMap in the VM's namespace. It reads virt-operator to find the
  # virt-launcher image, which has qemu-img, for Jobs on stopped VMs' disks.
  - apiGroups: ["kubevirt.io"]
    resources: ["kubevirts", "virtualmachines"]
    verbs: ["get", "list"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ibm-vpc-file-pool-vm-hook"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["virt-operator"]
    verbs: ["get"]
  # OpenShift allows exec into a pod only to a user who could create that
  # pod. VM pods run under the kubevirt-controller SCC, so replication needs
  # "use" on it to freeze a VM and start a disk copy. This adds no power to
  # start pods: the account cannot create pods directly; a pod can run as
  # this account only in the driver's namespace (kube-system), where OpenShift
  # applies no SCC, so the Jobs the controller creates there are unrestricted
  # already. On clusters without SCCs this rule has no effect.
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["kubevirt-controller"]
    verbs: ["use"]
  # VolumeSnapshot CRDs (for csi-snapshotter sidecar)
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  # PV/PVC access (CSI provisioner creates PVs and updates PVC status)
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  # Secrets (for IBM Cloud API key and sidecar secret watcher)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "watch", "list"]
  # ConfigMaps (for cluster config)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Check the caller of the metrics endpoint (token and rights)
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # Nodes (for CSI topology)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # CSI node info
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  # Storage classes
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch", "create"]
  # CDI StorageProfile access (optional — only used when CDI/KubeVirt is installed)
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["storageprofiles"]
    verbs: ["get", "patch"]
  # OpenShift Virtualization settings (CDI copy pod memory limit)
  - apiGroups: ["hco.kubevirt.io"]
    resources: ["hyperconvergeds"]
    verbs: ["get", "list", "patch"]
  # CDI DataImportCrons (golden image discovery)
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["dataimportcrons"]
    verbs: ["get", "list", "watch"]
  # CDI DataSources (InstanceTypes catalog visibility)
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datasources"]
    verbs: ["get", "list", "create", "delete"]
  # CDI DataVolumes (golden images are imported by CDI)
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "create", "delete"]
  # Jobs for share data (copies and removals on the shares)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # OpenShift ImageStreams (resolving golden image sources for RHEL)
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams"]
    verbs: ["get"]
  # OpenShift Templates for VM catalog
  - apiGroups: ["template.openshift.io"]
    resources: ["templates"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ibm-vpc-file-pool-csi-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ibm-vpc-file-pool-csi-controller
subjects:
  - kind: ServiceAccount
    name: ibm-vpc-file-pool-csi-controller
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ibm-vpc-file-pool-csi-node
rules:
  # Node read access (for zone detection)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  # SubVolume read access (for clone gate in NodePublishVolume and per-PVC stats)
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["subvolumes"]
    verbs: ["get"]
  # FileSharePool read access (names the shares in the per-share metrics)
  - apiGroups: ["storage.ibmcloud.io"]
    resources: ["filesharepools"]
    verbs: ["get", "list"]
  # Check the caller of the node metrics endpoint (token and rights)
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ibm-vpc-file-pool-csi-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ibm-vpc-file-pool-csi-node
subjects:
  - kind: ServiceAccount
    name: ibm-vpc-file-pool-csi-node
    namespace: kube-system
