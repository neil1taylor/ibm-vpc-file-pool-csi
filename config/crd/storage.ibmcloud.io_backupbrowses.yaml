---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: backupbrowses.storage.ibmcloud.io
spec:
  group: storage.ibmcloud.io
  names:
    kind: BackupBrowse
    listKind: BackupBrowseList
    plural: backupbrowses
    shortNames:
    - bb
    singular: backupbrowse
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.policy
      name: Policy
      type: string
    - jsonPath: .spec.pvcName
      name: Claim
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BackupBrowse is one open session on one backup of one volume. Users never
          make or see it: the backup gateway makes it after it checks the user's
          rights. The backup controller starts a read-only helper pod for it, and
          removes the pod and the session when it is idle, at its hard limit, or closed.
          See docs/specs/2026-10-22-backup-file-restore.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BackupBrowseSpec says which backup to open.
            properties:
              close:
                description: Close ends the session. The gateway sets it when a user
                  is done.
                type: boolean
              moment:
                description: |-
                  Moment is the time to open. The newest backup at or before it is read.
                  Unset means the latest copy.
                format: date-time
                type: string
              policy:
                description: Policy is the BackupPolicy that holds the backup.
                type: string
              pvcName:
                type: string
              pvcNamespace:
                description: |-
                  PVCNamespace and PVCName name the claim that was backed up. The claim may
                  be gone: the policy remembers its backups until the keep time.
                type: string
              requestedBy:
                description: |-
                  RequestedBy is the user who asked, for the audit trail. The gateway sets
                  it from the user's token; it is not used to decide anything.
                type: string
            required:
            - policy
            - pvcName
            - pvcNamespace
            type: object
          status:
            description: BackupBrowseStatus reports the session.
            properties:
              endReason:
                description: 'EndReason is why a session closed: idle, max-life, closed
                  or stopped.'
                type: string
              endedTime:
                description: EndedTime is when the session closed or failed.
                format: date-time
                type: string
              message:
                description: Message says what the session waits for, or why it failed
                  or closed.
                type: string
              phase:
                description: |-
                  Phase is Pending (waiting for a free session slot), Starting (the helper
                  pod is starting), Ready (the helper answers), Closed or Failed.
                enum:
                - Pending
                - Starting
                - Ready
                - Closed
                - Failed
                type: string
              podIP:
                description: PodIP and Port are where the helper answers, over TLS.
                type: string
              port:
                format: int32
                type: integer
              secretName:
                description: |-
                  SecretName is the Secret, in the driver namespace, that holds the session
                  token and the session certificate and key. It is owned by this resource.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
