---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: backupbrowses.storage.ibmcloud.io
spec:
  group: storage.ibmcloud.io
  names:
    kind: BackupBrowse
    listKind: BackupBrowseList
    plural: backupbrowses
    shortNames:
    - bb
    singular: backupbrowse
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.policy
      name: Policy
      type: string
    - jsonPath: .spec.pvcName
      name: Claim
      type: string
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BackupBrowse is one open session on one backup of one volume. Users never
          make or see it: the backup gateway makes it after it checks the user's
          rights. The backup controller starts a read-only helper pod for it, and
          removes the pod and the session when it is idle, at its hard limit, or closed.
          See docs/specs/2026-10-22-backup-file-restore.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BackupBrowseSpec says which backup to open.
            properties:
              close:
                description: Close ends the session. The gateway sets it when a user
                  is done.
                type: boolean
              fromCOS:
                description: |-
                  FromCOS names a bucket directly. It is for a cluster administrator, for a
                  backup that no policy of this cluster describes; policy is then only the
                  name of the policy's area in the bucket, and pvcNamespace and pvcName
                  hold "-" and the volume. Source must be cos.
                properties:
                  backupKeySecret:
                    description: |-
                      BackupKeySecret names the Secret with the backup key wrapped by Key
                      Protect (wrappedKey). Not used with emergencyKeyOnly.
                    type: string
                  bucket:
                    description: Bucket is the name of the COS bucket.
                    minLength: 1
                    type: string
                  credentialsSecret:
                    description: |-
                      CredentialsSecret names the Secret (in the driver's namespace) with the
                      COS key: access_key_id and secret_access_key.
                    minLength: 1
                    type: string
                  emergencyKeyOnly:
                    description: |-
                      EmergencyKeyOnly makes the helper use the readable key in
                      emergencyKeySecret and never call Key Protect.
                    type: boolean
                  emergencyKeySecret:
                    description: |-
                      EmergencyKeySecret names a Secret (key: backupKey) with the readable
                      backup key.
                    type: string
                  endpoint:
                    description: Endpoint is the S3 host of the bucket.
                    minLength: 1
                    type: string
                  keyProtect:
                    description: |-
                      KeyProtect says which root key unwraps the backup key. Not used with
                      emergencyKeyOnly.
                    properties:
                      apiKeySecret:
                        description: |-
                          APIKeySecret names the Secret (key: apikey) with the IBM Cloud API key that
                          has the Reader role on the root key.
                        minLength: 1
                        type: string
                      instanceID:
                        description: InstanceID is the GUID of the Key Protect instance.
                        minLength: 1
                        type: string
                      region:
                        description: Region is the region of the Key Protect instance,
                          such as eu-de.
                        minLength: 1
                        type: string
                      rootKeyID:
                        description: RootKeyID is the ID of the root key that wrapped
                          the backup key.
                        minLength: 1
                        type: string
                    required:
                    - apiKeySecret
                    - instanceID
                    - region
                    - rootKeyID
                    type: object
                  prefix:
                    description: |-
                      Prefix is the folder in the bucket that was set on the policy's export
                      block. The area of the policy (spec.policy) is below it.
                    type: string
                  volume:
                    description: |-
                      Volume is the backed-up volume, as `kubectl backup cos-list` shows it
                      (pvc- and a UUID).
                    minLength: 1
                    type: string
                required:
                - bucket
                - credentialsSecret
                - endpoint
                - volume
                type: object
              guest:
                description: |-
                  Guest reads the file systems inside a VM disk instead of the files of the
                  backup folder. The helper then shows the disk as it was at the moment, to a
                  small read-only appliance VM that reads the partitions and the file systems
                  of the guest. It needs the policy's volume to be a VM disk. The session
                  holds the disk's next backup copy while it is open. The gateway sets it for
                  every VM disk.
                type: boolean
              moment:
                description: |-
                  Moment is the time to open. The newest backup at or before it is read.
                  Unset means the latest copy.
                format: date-time
                type: string
              policy:
                description: Policy is the BackupPolicy that holds the backup.
                type: string
              pvcName:
                type: string
              pvcNamespace:
                description: |-
                  PVCNamespace and PVCName name the claim that was backed up. The claim may
                  be gone: the policy remembers its backups until the keep time.
                type: string
              requestedBy:
                description: |-
                  RequestedBy is the user who asked, for the audit trail. The gateway sets
                  it from the user's token; it is not used to decide anything.
                type: string
              source:
                description: |-
                  Source says where the backup is read from: local (the snapshot pool, the
                  default) or cos (the Kopia repository in the COS bucket that the policy's
                  export block names). A COS session needs the policy to have an export
                  block, unless fromCOS is set.
                enum:
                - local
                - cos
                type: string
            required:
            - policy
            - pvcName
            - pvcNamespace
            type: object
          status:
            description: BackupBrowseStatus reports the session.
            properties:
              endReason:
                description: 'EndReason is why a session closed: idle, max-life, closed
                  or stopped.'
                type: string
              endedTime:
                description: EndedTime is when the session closed or failed.
                format: date-time
                type: string
              message:
                description: Message says what the session waits for, or why it failed
                  or closed.
                type: string
              phase:
                description: |-
                  Phase is Pending (waiting for a free session slot), Starting (the helper
                  pod is starting), Ready (the helper answers), Closed or Failed.
                enum:
                - Pending
                - Starting
                - Ready
                - Closed
                - Failed
                type: string
              podIP:
                description: PodIP and Port are where the helper answers, over TLS.
                type: string
              port:
                format: int32
                type: integer
              secretName:
                description: |-
                  SecretName is the Secret, in the browse namespace, that holds the session
                  token and the session certificate and key. It is owned by this resource.
                  A session that reads COS has a copy in the driver namespace, which its
                  helper mounts; the gateway reads only the one in the browse namespace.
                type: string
              startedTime:
                description: |-
                  StartedTime is when the helper pod was started. A session that reads COS
                  fails if its helper is not ready a few minutes after this.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
