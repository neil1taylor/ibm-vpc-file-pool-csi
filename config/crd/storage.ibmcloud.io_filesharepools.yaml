---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: filesharepools.storage.ibmcloud.io
spec:
  group: storage.ibmcloud.io
  names:
    kind: FileSharePool
    listKind: FileSharePoolList
    plural: filesharepools
    shortNames:
    - fsp
    singular: filesharepool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.zone
      name: Zone
      type: string
    - jsonPath: .spec.profile
      name: Profile
      type: string
    - jsonPath: .status.shareCount
      name: Shares
      type: integer
    - jsonPath: .status.totalCapacityGB
      name: Capacity
      type: string
    - jsonPath: .status.totalAllocatedGB
      name: Allocated
      type: string
    - jsonPath: .status.totalPVCCount
      name: PVCs
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: FileSharePool defines a pool of VPC file shares that back PVC
          subdirectories.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              accessorZones:
                description: |-
                  AccessorZones defines additional zones where pool shares should have mount targets.
                  This enables cross-zone access: nodes in accessor zones can mount shares via
                  zone-local NFS IPs instead of cross-zone traffic.
                  When empty, shares are only accessible from the home zone (spec.zone).
                items:
                  description: AccessorZone defines a zone where pool shares should
                    have additional mount targets.
                  properties:
                    subnetID:
                      description: SubnetID is the VPC subnet in the accessor zone
                        to create mount targets in.
                      type: string
                    zone:
                      description: Zone is the VPC availability zone (e.g., "us-south-2").
                      pattern: ^[a-z]{2}-[a-z]+-\d+$
                      type: string
                  required:
                  - subnetID
                  - zone
                  type: object
                type: array
              allocationStrategy:
                default: spread
                description: |-
                  AllocationStrategy controls how PVCs are distributed across shares.
                  "spread" distributes evenly (lower blast radius).
                  "binpack" fills shares before using the next (fewer shares used).
                enum:
                - spread
                - binpack
                type: string
              autoExpand:
                default: true
                description: |-
                  AutoExpand controls whether the pool manager automatically creates new shares
                  when existing shares are filling up.
                type: boolean
              defaultGID:
                description: DefaultGID is the default owner GID for new subdirectories.
                format: int64
                type: integer
              defaultPermissions:
                default: "0755"
                description: DefaultPermissions is the Unix permissions for new PVC
                  subdirectories.
                type: string
              defaultUID:
                description: DefaultUID is the default owner UID for new subdirectories.
                format: int64
                type: integer
              drainShares:
                description: |-
                  DrainShares lists VPC share IDs that should be drained (evacuated).
                  Shares in this list will be marked as "draining" and excluded from new allocations.
                  Once all SubVolumes are removed from a draining share, it is considered fully drained.
                items:
                  type: string
                type: array
              encryptionInTransit:
                default: false
                description: EncryptionInTransit enables NFS encryption in transit
                  (NFSv4.1 + Kerberos).
                type: boolean
              expandThresholdPercent:
                default: 80
                description: |-
                  ExpandThresholdPercent is the pool-wide allocation percentage that triggers
                  creation of a new share. Range 50-95.
                format: int32
                maximum: 95
                minimum: 50
                type: integer
              goldenImages:
                description: |-
                  GoldenImages configures automatic golden image synchronization.
                  When enabled, the controller discovers OS images from CDI DataImportCrons
                  and maintains ready-to-clone golden image PVCs in target namespaces.
                  Not needed when the pool StorageClass is the cluster default (CDI handles natively).
                properties:
                  converterImage:
                    default: quay.io/centos/centos:stream9
                    description: ConverterImage is the container image used for qcow2-to-raw
                      conversion jobs.
                    type: string
                  enabled:
                    description: Enabled activates the golden image syncer for this
                      pool.
                    type: boolean
                  imageFilter:
                    description: |-
                      ImageFilter limits syncing to images whose names contain one of these substrings.
                      Empty means sync all discovered images.
                    items:
                      type: string
                    type: array
                  pvcSizeGB:
                    default: 15
                    description: PVCSizeGB is the size of golden image PVCs in GB.
                    format: int64
                    minimum: 5
                    type: integer
                  refreshInterval:
                    default: 24h
                    description: RefreshInterval is how often the syncer checks for
                      new images (e.g. "24h", "1h").
                    type: string
                  targetNamespaces:
                    description: TargetNamespaces lists namespaces where golden image
                      PVCs and Templates are created.
                    items:
                      type: string
                    minItems: 1
                    type: array
                required:
                - enabled
                - targetNamespaces
                type: object
              initialShares:
                default: 1
                description: InitialShares is the number of shares to pre-create when
                  the pool is first reconciled.
                format: int32
                minimum: 0
                type: integer
              iops:
                description: IOPS is the IOPS allocation per share. Only used with
                  custom profiles.
                format: int64
                minimum: 100
                type: integer
              maxShares:
                default: 10
                description: MaxShares is the maximum number of VPC file shares the
                  pool may create.
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              mountOptions:
                description: MountOptions are additional NFS mount options applied
                  by the node agent.
                items:
                  type: string
                type: array
              profile:
                description: Profile is the VPC file storage profile (e.g., "dp2",
                  "custom").
                type: string
              resourceGroup:
                description: ResourceGroup is the IBM Cloud resource group ID for
                  created shares.
                type: string
              shareSizeGB:
                default: 1000
                description: ShareSizeGB is the size in GB for each share created
                  in the pool.
                format: int64
                maximum: 32000
                minimum: 10
                type: integer
              tags:
                description: Tags are IBM Cloud tags applied to created shares.
                items:
                  type: string
                type: array
              tiers:
                description: |-
                  Tiers defines multiple performance tiers within the pool.
                  If empty, the top-level profile/shareSizeGB/iops/maxShares/initialShares fields
                  define an implicit default tier.
                items:
                  description: ShareTier defines the VPC share configuration for a
                    performance tier within the pool.
                  properties:
                    initialShares:
                      default: 1
                      description: InitialShares is the number of shares to pre-create
                        for this tier.
                      format: int32
                      minimum: 0
                      type: integer
                    iops:
                      description: IOPS is the IOPS allocation per share. Only used
                        with custom profiles.
                      format: int64
                      type: integer
                    maxShares:
                      description: MaxShares is the maximum number of shares for this
                        tier.
                      format: int32
                      maximum: 100
                      minimum: 1
                      type: integer
                    name:
                      description: Name is the tier identifier referenced from StorageClass
                        parameters.
                      pattern: ^[a-z0-9-]+$
                      type: string
                    profile:
                      description: Profile is the VPC file storage profile (e.g.,
                        "dp2", "custom").
                      type: string
                    shareSizeGB:
                      description: ShareSizeGB is the size in GB for shares in this
                        tier.
                      format: int64
                      maximum: 32000
                      minimum: 10
                      type: integer
                  required:
                  - initialShares
                  - maxShares
                  - name
                  - profile
                  - shareSizeGB
                  type: object
                type: array
              zone:
                description: Zone is the VPC availability zone for shares in this
                  pool.
                pattern: ^[a-z]{2}-[a-z]+-\d+$
                type: string
            required:
            - allocationStrategy
            - autoExpand
            - defaultPermissions
            - encryptionInTransit
            - expandThresholdPercent
            - initialShares
            - maxShares
            - profile
            - shareSizeGB
            - zone
            type: object
          status:
            properties:
              conditions:
                description: Conditions follows the standard Kubernetes conditions
                  pattern.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              drainStatus:
                description: DrainStatus tracks the progress of share draining operations.
                items:
                  description: ShareDrainStatus tracks the draining progress for a
                    single share.
                  properties:
                    drainStartedAt:
                      description: DrainStartedAt is when the drain was initiated.
                      format: date-time
                      type: string
                    drained:
                      description: Drained is true when the share has zero SubVolumes
                        remaining.
                      type: boolean
                    remainingSubVolumes:
                      description: RemainingSubVolumes is the number of SubVolumes
                        still on this share.
                      format: int32
                      type: integer
                    shareID:
                      description: ShareID is the VPC file share ID being drained.
                      type: string
                  required:
                  - drained
                  - remainingSubVolumes
                  - shareID
                  type: object
                type: array
              goldenImages:
                description: GoldenImages tracks golden image sync state.
                items:
                  description: GoldenImageStatus tracks the sync state for a single
                    golden image.
                  properties:
                    name:
                      description: Name is the image identifier (e.g. "centos-stream9").
                      type: string
                    namespaces:
                      description: Namespaces tracks per-namespace sync state.
                      items:
                        description: GoldenImageNamespaceStatus tracks the sync state
                          for a golden image in a single namespace.
                        properties:
                          dataSourceName:
                            description: DataSourceName is the CDI DataSource for
                              the InstanceTypes catalog.
                            type: string
                          lastSyncTime:
                            description: LastSyncTime is when this image was last
                              synced.
                            format: date-time
                            type: string
                          message:
                            description: Message is a human-readable status message.
                            type: string
                          namespace:
                            description: Namespace is the target namespace.
                            type: string
                          phase:
                            description: 'Phase is the sync state: Pending, Syncing,
                              Ready, Failed.'
                            enum:
                            - Pending
                            - Syncing
                            - Ready
                            - Failed
                            type: string
                          pvcName:
                            description: PVCName is the name of the golden image PVC.
                            type: string
                          templateName:
                            description: TemplateName is the name of the OpenShift
                              VM Template.
                            type: string
                        required:
                        - namespace
                        - phase
                        type: object
                      type: array
                    sourceURL:
                      description: SourceURL is the container registry URL for this
                        image.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              lastReconcileTime:
                description: LastReconcileTime is when the pool was last reconciled.
                format: date-time
                type: string
              phase:
                description: Phase is the overall pool state.
                enum:
                - Initializing
                - Ready
                - Expanding
                - Degraded
                - Full
                type: string
              shareCount:
                description: ShareCount is the current number of shares.
                format: int32
                type: integer
              shares:
                description: Shares lists all VPC file shares managed by this pool.
                items:
                  properties:
                    allocatedGB:
                      description: AllocatedGB is the sum of SubVolume allocations
                        on this share.
                      format: int64
                      type: integer
                    createdAt:
                      description: CreatedAt is when the share was created.
                      format: date-time
                      type: string
                    exportPath:
                      description: |-
                        ExportPath is the NFS export path for this share (e.g. "/share_abc123").
                        VPC access mode shares use a per-share export path under a shared FQDN.
                      type: string
                    mountTargetID:
                      description: MountTargetID is the VPC mount target resource
                        ID.
                      type: string
                    mountTargetIP:
                      description: MountTargetIP is the NFS server IP or FQDN for
                        this share.
                      type: string
                    mountTargets:
                      description: |-
                        MountTargets records mount targets across all zones (home + accessor).
                        When empty, only the primary MountTargetIP/MountTargetID are used (backward compat).
                      items:
                        description: ZoneMountTarget records a mount target created
                          in a specific zone.
                        properties:
                          exportPath:
                            description: ExportPath is the NFS export path for this
                              zone's mount target.
                            type: string
                          mountTargetID:
                            description: MountTargetID is the VPC mount target resource
                              ID.
                            type: string
                          mountTargetIP:
                            description: MountTargetIP is the NFS server IP or FQDN
                              in this zone.
                            type: string
                          zone:
                            description: Zone is the VPC availability zone of this
                              mount target.
                            type: string
                        required:
                        - mountTargetID
                        - mountTargetIP
                        - zone
                        type: object
                      type: array
                    pvcCount:
                      description: PVCCount is the number of SubVolumes on this share.
                      format: int32
                      type: integer
                    shareID:
                      description: ShareID is the VPC file share ID (e.g., "r006-xxxx").
                      type: string
                    shareName:
                      description: ShareName is the VPC file share name.
                      type: string
                    state:
                      description: State is the share's health state.
                      enum:
                      - creating
                      - stable
                      - draining
                      - degraded
                      - deleting
                      type: string
                    tier:
                      description: Tier is the name of the ShareTier this share belongs
                        to. Empty for pools without tiers.
                      type: string
                    totalGB:
                      description: TotalGB is the provisioned size of this share.
                      format: int64
                      type: integer
                    zone:
                      description: Zone is the availability zone of this share.
                      type: string
                  required:
                  - allocatedGB
                  - mountTargetID
                  - mountTargetIP
                  - pvcCount
                  - shareID
                  - shareName
                  - state
                  - totalGB
                  - zone
                  type: object
                type: array
              totalAllocatedGB:
                description: TotalAllocatedGB is the sum of all SubVolume requested
                  sizes.
                format: int64
                type: integer
              totalCapacityGB:
                description: TotalCapacityGB is the sum of all share sizes.
                format: int64
                type: integer
              totalPVCCount:
                description: TotalPVCCount is the total number of active SubVolumes
                  across all shares.
                format: int32
                type: integer
            required:
            - shareCount
            - totalAllocatedGB
            - totalCapacityGB
            - totalPVCCount
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
