---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: snapshots.storage.ibmcloud.io
spec:
  group: storage.ibmcloud.io
  names:
    kind: Snapshot
    listKind: SnapshotList
    plural: snapshots
    shortNames:
    - snap
    singular: snapshot
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolName
      name: Pool
      type: string
    - jsonPath: .spec.sourceSubVolume
      name: Source
      type: string
    - jsonPath: .spec.sizeGB
      name: Size
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyToUse
      name: Ready
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Snapshot tracks a point-in-time directory-level copy of a SubVolume.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              poolName:
                description: PoolName references the FileSharePool containing the
                  source volume.
                type: string
              shareID:
                description: ShareID is the VPC file share ID where the snapshot resides.
                type: string
              shareMountTargetIP:
                description: ShareMountTargetIP is the NFS mount target IP for the
                  share.
                type: string
              sizeGB:
                description: SizeGB is the allocated size of the snapshot in GB.
                format: int64
                minimum: 1
                type: integer
              snapshotPath:
                description: SnapshotPath is the directory path of the snapshot (e.g.,
                  "/pvcs/.snapshots/snap-xxx").
                type: string
              sourceSubPath:
                description: SourceSubPath is the original SubVolume directory path
                  (e.g., "/pvcs/pvc-xxx").
                type: string
              sourceSubVolume:
                description: SourceSubVolume is the name of the SubVolume this snapshot
                  was taken from.
                type: string
            required:
            - poolName
            - shareID
            - shareMountTargetIP
            - sizeGB
            - snapshotPath
            - sourceSubPath
            - sourceSubVolume
            type: object
          status:
            properties:
              creationTime:
                description: CreationTime is when the snapshot was created.
                format: date-time
                type: string
              phase:
                description: Phase is the snapshot lifecycle state.
                enum:
                - Creating
                - Ready
                - Deleting
                - Failed
                type: string
              readyToUse:
                description: ReadyToUse indicates whether the snapshot is complete
                  and available for restore.
                type: boolean
              sizeBytes:
