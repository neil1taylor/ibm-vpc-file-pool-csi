---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: snapshots.storage.ibmcloud.io
spec:
  group: storage.ibmcloud.io
  names:
    kind: Snapshot
    listKind: SnapshotList
    plural: snapshots
    shortNames:
    - snap
    singular: snapshot
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolName
      name: Pool
      type: string
    - jsonPath: .spec.sourceSubVolume
      name: Source
      type: string
    - jsonPath: .spec.sizeGB
      name: Size
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyToUse
      name: Ready
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Snapshot tracks a point-in-time directory-level copy of a SubVolume.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              poolName:
                description: PoolName references the FileSharePool containing the
                  source volume.
                type: string
              shareID:
                description: ShareID is the VPC file share ID where the snapshot resides.
                type: string
              shareMountTargetIP:
                description: ShareMountTargetIP is the NFS mount target IP for the
                  share.
                type: string
              sizeGB:
                description: SizeGB is the allocated size of the snapshot in GB.
                format: int64
                minimum: 1
                type: integer
              snapshotPath:
                description: SnapshotPath is the directory path of the snapshot (e.g.,
                  "/pvcs/.snapshots/snap-xxx").
                type: string
              sourceSubPath:
                description: SourceSubPath is the original SubVolume directory path
                  (e.g., "/pvcs/pvc-xxx").
                type: string
              sourceSubVolume:
                description: SourceSubVolume is the name of the SubVolume this snapshot
                  was taken from.
                type: string
            required:
            - poolName
            - shareID
            - shareMountTargetIP
            - sizeGB
            - snapshotPath
            - sourceSubPath
            - sourceSubVolume
            type: object
          status:
            properties:
              consistency:
                description: |-
                  Consistency of a snapshot of a running VM's disk.
                  FileSystemConsistent means the guest file systems were frozen for the
                  copy. CrashConsistent means they were not, as after a power loss.
                enum:
                - FileSystemConsistent
                - CrashConsistent
                type: string
              consistencyReason:
                description: ConsistencyReason says why a snapshot is only crash consistent.
                type: string
              copyMoment:
                description: CopyMoment is the moment a snapshot of a running VM's
                  disk shows.
                format: date-time
                type: string
              creationTime:
                description: CreationTime is when the snapshot was created.
                format: date-time
                type: string
              message:
                description: Message says what a snapshot waits for or why it failed.
                type: string
              phase:
                description: Phase is the snapshot lifecycle state.
                enum:
                - Creating
                - Ready
                - Deleting
                - Failed
                type: string
              readyToUse:
                description: ReadyToUse indicates whether the snapshot is complete
                  and available for restore.
                type: boolean
              sizeBytes:
                description: SizeBytes is the actual size of the snapshot data.
                format: int64
                type: integer
              vmCopy:
                description: |-
                  VMCopy is the state of the QEMU copy while a snapshot of a running VM's
                  disk is made. It is empty for other snapshots and once the copy ends.
                properties:
                  base:
                    type: string
                  bitmap:
                    description: |-
                      Bitmap is the change list this copy started. Base is the change list it
                      read, for a change copy; Incremental is true then.
                    type: string
                  diskIndex:
                    format: int32
                    type: integer
                  fileSystemConsistent:
                    description: FileSystemConsistent is true if the guest was frozen
                      for the copy.
                    type: boolean
                  freezeError:
                    description: FreezeError is the freeze error, if the freeze failed.
                    type: string
                  id:
                    description: ID names the copy. It is the same for all disks of
                      one VM copy.
                    type: string
                  incremental:
                    type: boolean
                  moment:
                    description: Moment is the moment the copy shows.
                    format: date-time
                    type: string
                  phase:
                    description: |-
                      Phase is Copying while QEMU writes the staging file, and Sending while
                      a Job applies it at the destination.
                    enum:
                    - Copying
                    - Sending
                    type: string
                  podName:
                    description: |-
                      PodName and PodUID identify the virt-launcher pod. If the pod changes,
                      the VM restarted or moved and QEMU no longer has the copy.
                    type: string
                  podNamespace:
                    description: |-
                      PodNamespace is the namespace of the VM pod. A snapshot copy sets it so
                      the copy can be watched and cancelled without its source volume.
                    type: string
                  podUID:
                    type: string
                  stagingFile:
                    description: StagingFile is the staging file name in the volume's
                      root directory.
                    type: string
                  vmiName:
                    description: VMIName is the VirtualMachineInstance name.
                    type: string
                  volume:
                    description: |-
                      Volume is the pod volume name of this disk, and DiskIndex its place in
                      the copy.
                    type: string
                required:
                - bitmap
                - diskIndex
                - fileSystemConsistent
                - id
                - moment
                - phase
                - podName
                - podUID
                - stagingFile
                - vmiName
                - volume
                type: object
              vmCopyAttempts:
                description: |-
                  VMCopyAttempts counts the copies that were cancelled or failed for a
                  snapshot of a running VM. After 3 the snapshot fails.
                format: int32
                type: integer
              vmCopyRetryAfter:
                description: VMCopyRetryAfter is the earliest time of the next copy
                  try.
                format: date-time
                type: string
              vmCopyStarted:
                description: |-
                  VMCopyStarted is when the current copy try started. A try that runs
                  much longer than the disk needs is cancelled.
                format: date-time
                type: string
            required:
            - readyToUse
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
