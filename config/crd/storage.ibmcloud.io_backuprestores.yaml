---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: backuprestores.storage.ibmcloud.io
spec:
  group: storage.ibmcloud.io
  names:
    kind: BackupRestore
    listKind: BackupRestoreList
    plural: backuprestores
    shortNames:
    - br
    singular: backuprestore
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.policy
      name: Policy
      type: string
    - jsonPath: .spec.sourceName
      name: Source
      type: string
    - jsonPath: .spec.targetName
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BackupRestore asks the driver to make a new PVC from a backup. The driver
          makes the PVC, copies the backup into it with a Job, and holds back any pod
          that mounts it until the copy has ended. It never writes over a volume that
          exists. See docs/specs/2026-10-21-backup-to-snapshot-pool.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BackupRestoreSpec says what to restore, and where to.
            properties:
              moment:
                description: |-
                  Moment is the time to restore. The newest backup at or before it is
                  used. Unset means the latest backup.
                format: date-time
                type: string
              policy:
                description: Policy is the BackupPolicy that holds the backup.
                type: string
              sourceName:
                type: string
              sourceNamespace:
                description: |-
                  SourceNamespace and SourceName name the claim that was backed up. The
                  claim may be gone: the policy remembers its backups until the keep time.
                type: string
              storageClassName:
                description: |-
                  StorageClassName is the class of the new PVC. Unset means the class of
                  the backed-up claim.
                type: string
              targetName:
                type: string
              targetNamespace:
                description: TargetNamespace and TargetName name the new PVC. It must
                  not exist.
                type: string
            required:
            - policy
            - sourceName
            - sourceNamespace
            - targetName
            - targetNamespace
            type: object
          status:
            description: BackupRestoreStatus reports how far the restore is.
            properties:
              latest:
                description: Latest is true if the newest backup was written.
                type: boolean
              message:
                description: Message says what the restore waits for, or why it failed.
                type: string
              phase:
                description: |-
                  Phase is Pending, Provisioning (the PVC is being made), Restoring (the
                  copy runs), Done or Failed.
                enum:
                - Pending
                - Provisioning
                - Restoring
                - Done
                - Failed
                type: string
              restoredMoment:
                description: |-
                  RestoredMoment is the moment of the backup that was written. Unset if
                  it is not known (the first copy of a volume).
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
