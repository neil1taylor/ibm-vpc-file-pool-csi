---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: backupfilerestores.storage.ibmcloud.io
spec:
  group: storage.ibmcloud.io
  names:
    kind: BackupFileRestore
    listKind: BackupFileRestoreList
    plural: backupfilerestores
    shortNames:
    - bfr
    singular: backupfilerestore
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.policy
      name: Policy
      type: string
    - jsonPath: .spec.sourceName
      name: Source
      type: string
    - jsonPath: .spec.targetName
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BackupFileRestore asks the driver to copy chosen files and folders out of a
          backup into a claim: a new claim, or a new folder in an existing claim. It
          never writes over a file that exists and never writes into a VM disk. The
          backup gateway makes it for a user after it checks the user's rights; a
          cluster administrator may make one by hand. See
          docs/specs/2026-10-22-backup-file-restore.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BackupFileRestoreSpec says what to restore, and where to.
            properties:
              existing:
                description: |-
                  Existing restores into a new folder of the claim, which must exist. Unset
                  makes a new claim, which must not exist.
                type: boolean
              fromCOS:
                description: |-
                  FromCOS names a bucket directly. It is for a cluster administrator, for a
                  backup that no policy of this cluster describes; policy is then only the
                  name of the policy's area in the bucket, sourceNamespace holds "-" and
                  sourceName the volume, and storageClassName must be set for a new claim.
                  Source must be cos.
                properties:
                  backupKeySecret:
                    description: |-
                      BackupKeySecret names the Secret with the backup key wrapped by Key
                      Protect (wrappedKey). Not used with emergencyKeyOnly.
                    type: string
                  bucket:
                    description: Bucket is the name of the COS bucket.
                    minLength: 1
                    type: string
                  credentialsSecret:
                    description: |-
                      CredentialsSecret names the Secret (in the driver's namespace) with the
                      COS key: access_key_id and secret_access_key.
                    minLength: 1
                    type: string
                  emergencyKeyOnly:
                    description: |-
                      EmergencyKeyOnly makes the helper use the readable key in
                      emergencyKeySecret and never call Key Protect.
                    type: boolean
                  emergencyKeySecret:
                    description: |-
                      EmergencyKeySecret names a Secret (key: backupKey) with the readable
                      backup key.
                    type: string
                  endpoint:
                    description: Endpoint is the S3 host of the bucket.
                    minLength: 1
                    type: string
                  keyProtect:
                    description: |-
                      KeyProtect says which root key unwraps the backup key. Not used with
                      emergencyKeyOnly.
                    properties:
                      apiKeySecret:
                        description: |-
                          APIKeySecret names the Secret (key: apikey) with the IBM Cloud API key that
                          has the Reader role on the root key.
                        minLength: 1
                        type: string
                      instanceID:
                        description: InstanceID is the GUID of the Key Protect instance.
                        minLength: 1
                        type: string
                      region:
                        description: Region is the region of the Key Protect instance,
                          such as eu-de.
                        minLength: 1
                        type: string
                      rootKeyID:
                        description: RootKeyID is the ID of the root key that wrapped
                          the backup key.
                        minLength: 1
                        type: string
                    required:
                    - apiKeySecret
                    - instanceID
                    - region
                    - rootKeyID
                    type: object
                  prefix:
                    description: |-
                      Prefix is the folder in the bucket that was set on the policy's export
                      block. The area of the policy (spec.policy) is below it.
                    type: string
                  volume:
                    description: |-
                      Volume is the backed-up volume, as `kubectl backup cos-list` shows it
                      (pvc- and a UUID).
                    minLength: 1
                    type: string
                required:
                - bucket
                - credentialsSecret
                - endpoint
                - volume
                type: object
              moment:
                description: |-
                  Moment is the time to restore from. The newest backup at or before it is
                  used. Unset means the latest copy.
                format: date-time
                type: string
              paths:
                description: |-
                  Paths are the files and folders to restore, below the root of the
                  backed-up volume, one path each in the escaped form that `kubectl backup`
                  prints (a backslash is written \\ and a byte that is not text \xNN). A
                  folder is restored with everything in it. The path / restores the whole
                  volume.
                items:
                  type: string
                maxItems: 1000
                minItems: 1
                type: array
              policy:
                description: Policy is the BackupPolicy that holds the backup.
                type: string
              requestedBy:
                description: |-
                  RequestedBy is the user who asked, for the audit trail. The gateway sets
                  it from the user's token; it is not used to decide anything.
                type: string
              sizeGB:
                description: |-
                  SizeGB is the size of a new claim. Unset sizes it to the chosen files plus
                  20%, at least 1 GiB. Not used with existing.
                format: int64
                type: integer
              source:
                description: |-
                  Source says where the backup is read from: local (the snapshot pool, the
                  default) or cos (the Kopia repository in the COS bucket that the policy's
                  export block names, or that fromCOS names).
                enum:
                - local
                - cos
                type: string
              sourceName:
                type: string
              sourceNamespace:
                description: |-
                  SourceNamespace and SourceName name the claim that was backed up. The
                  claim may be gone: the policy remembers its backups until the keep time.
                type: string
              storageClassName:
                description: |-
                  StorageClassName is the class of a new claim. Unset means the class of the
                  backed-up claim.
                type: string
              targetName:
                type: string
              targetNamespace:
                description: TargetNamespace and TargetName name the claim that gets
                  the files.
                type: string
              targetUID:
                description: |-
                  TargetUID is the UID of the existing claim, taken when the user's rights
                  were checked. The restore refuses if the claim was deleted and made again
                  since. The gateway sets it. If it is unset, the controller takes the UID of
                  the claim the first time it sees it.
                type: string
            required:
            - paths
            - policy
            - sourceName
            - sourceNamespace
            - targetName
            - targetNamespace
            type: object
          status:
            description: BackupFileRestoreStatus reports how far the restore is.
            properties:
              bytes:
                format: int64
                type: integer
              dirs:
                type: integer
              endedTime:
                description: EndedTime is when the restore reached Done or Failed.
                format: date-time
                type: string
              files:
                description: |-
                  Files, Dirs and Links count what was written; Skipped counts devices,
                  pipes and sockets left out, and Unreadable counts entries the reader could
                  not read. Bytes is the size of the files.
                type: integer
              folder:
                description: Folder is the folder made in an existing claim.
                type: string
              latest:
                description: Latest is true if the newest backup was read.
                type: boolean
              links:
                type: integer
              message:
                description: Message says what the restore waits for, or why it failed.
                type: string
              phase:
                description: |-
                  Phase is Pending, Measuring (a new claim is being sized), Provisioning (the
                  claim is being made), Restoring (the copy runs), Done or Failed.
                enum:
                - Pending
                - Measuring
                - Provisioning
                - Restoring
                - Done
                - Failed
                type: string
              restoredMoment:
                description: |-
                  RestoredMoment is the moment of the backup that was read. Unset if it is
                  not known (the first copy of a volume).
                format: date-time
                type: string
              sizeGB:
                description: SizeGB is the size chosen for a new claim.
                format: int64
                type: integer
              skipped:
                type: integer
              targetUID:
                description: |-
                  TargetUID is the UID of the claim this restore writes to. It is set the
                  first time the claim is seen, and the restore refuses a claim with another UID.
                type: string
              unreadable:
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
