---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: subvolumes.storage.ibmcloud.io
spec:
  group: storage.ibmcloud.io
  names:
    kind: SubVolume
    listKind: SubVolumeList
    plural: subvolumes
    shortNames:
    - sv
    singular: subvolume
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolName
      name: Pool
      type: string
    - jsonPath: .spec.shareID
      name: Share
      priority: 1
      type: string
    - jsonPath: .spec.requestedGB
      name: Size
      type: string
    - jsonPath: .spec.pvcName
      name: PVC
      type: string
    - jsonPath: .spec.pvcNamespace
      name: Namespace
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SubVolume tracks a single PVC's allocation within a pool share.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              gid:
                description: GID is the Unix GID for the subdirectory owner.
                format: int64
                type: integer
              permissions:
                description: Permissions is the Unix permissions string (e.g., "0755").
                type: string
              poolName:
                description: PoolName references the FileSharePool this SubVolume
                  belongs to.
                type: string
              pvName:
                description: PVName is the name of the PersistentVolume bound to this
                  SubVolume.
                type: string
              pvcName:
                description: PVCName is the name of the PersistentVolumeClaim.
                type: string
              pvcNamespace:
                description: PVCNamespace is the namespace of the PersistentVolumeClaim.
                type: string
              reclaimPolicy:
                default: Delete
                description: ReclaimPolicy determines what happens to the subdirectory
                  when the PVC is deleted.
                enum:
                - Delete
                - Retain
                - Archive
                type: string
              requestedGB:
                description: RequestedGB is the capacity requested by the PVC.
                format: int64
                minimum: 1
                type: integer
              shareID:
                description: ShareID is the VPC file share ID hosting this SubVolume.
                type: string
              shareMountTargetIP:
                description: |-
                  ShareMountTargetIP is the NFS mount target IP.
                  Denormalized here for fast lookups during NodePublishVolume.
                type: string
              sourceShareID:
                description: |-
                  SourceShareID is the VPC file share ID of the source SubVolume.
                  Populated when the clone source is on a different share than the target.
                type: string
              sourceVolume:
                description: |-
                  SourceVolume is the name of the source SubVolume this was cloned from.
                  Empty for non-clone SubVolumes.
                type: string
              subPath:
                description: SubPath is the subdirectory path within the share (e.g.,
                  "/pvcs/pvc-abc123").
                pattern: ^/pvcs/pvc-[a-f0-9-]+$
                type: string
              uid:
                description: UID is the Unix UID for the subdirectory owner.
                format: int64
                type: integer
            required:
            - poolName
            - pvName
            - pvcName
            - pvcNamespace
            - reclaimPolicy
            - requestedGB
            - shareID
            - shareMountTargetIP
            - subPath
            type: object
          status:
            properties:
              actualUsageBytes:
                description: ActualUsageBytes is the last measured disk usage of the
                  subdirectory.
                format: int64
                type: integer
              conditions:
                description: Conditions for detailed state tracking.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              createdAt:
                description: CreatedAt is when the subdirectory was created on the
                  share.
                format: date-time
                type: string
              lastUsageCheck:
                description: LastUsageCheck is when ActualUsageBytes was last updated.
                format: date-time
                type: string
              cloneProgress:
                description: CloneProgress tracks bytes copied during a clone operation.
                properties:
                  bytesCopied:
                    description: BytesCopied is the number of bytes copied so far.
                    format: int64
                    type: integer
                  completedAt:
                    description: CompletedAt is when the copy operation finished (success
                      or failure).
                    format: date-time
                    type: string
                  error:
                    description: Error records the failure reason if cloneStatus is
                      Failed.
                    type: string
                  startedAt:
                    description: StartedAt is when the copy operation started.
                    format: date-time
                    type: string
                  totalBytes:
                    description: TotalBytes is the total size of the source data to
                      copy.
                    format: int64
                    type: integer
                required:
                - bytesCopied
                - totalBytes
                type: object
              cloneStatus:
                description: |-
                  CloneStatus tracks the progress of a clone operation.
                  Empty for non-clone SubVolumes.
                enum:
                - Pending
                - InProgress
                - Complete
                - Failed
                type: string
              phase:
                description: Phase is the SubVolume lifecycle state.
                enum:
                - Creating
                - Cloning
                - Bound
                - Expanding
                - Deleting
                - Retained
                - Archived
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
