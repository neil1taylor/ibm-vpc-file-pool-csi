---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: replicationpolicies.storage.ibmcloud.io
spec:
  group: storage.ibmcloud.io
  names:
    kind: ReplicationPolicy
    listKind: ReplicationPolicyList
    plural: replicationpolicies
    shortNames:
    - rp
    singular: replicationpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourcePoolName
      name: Source
      type: string
    - jsonPath: .spec.destinationNFSServer
      name: Dest
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ReplicationPolicy defines a replication relationship between a source pool
          and a destination NFS server for cross-region disaster recovery.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReplicationPolicySpec defines the desired state of a replication
              policy.
            properties:
              bandwidthLimitMbps:
                default: 0
                description: |-
                  BandwidthLimitMbps limits rsync bandwidth in megabits per second.
                  Only applies when IncrementalSync is true. 0 means no limit.
                format: int32
                minimum: 0
                type: integer
              destinationAuthSecretRef:
                description: |-
                  DestinationAuthSecretRef is the name of a Secret in kube-system containing
                  a "token" key with the bearer token for authenticating to the receiver.
                  Required when DestinationEndpoint is set.
                type: string
              destinationBasePath:
                description: |-
                  DestinationBasePath is the base path on the destination NFS server
                  where replicated SubVolume directories are written (e.g., "/pvcs").
                type: string
              destinationCACertSecretRef:
                description: |-
                  DestinationCACertSecretRef is the name of a Secret in kube-system containing
                  a "ca.crt" key with the CA certificate for verifying the receiver's TLS cert.
                  Required when the receiver uses a self-signed certificate.
                type: string
              destinationEndpoint:
                description: |-
                  DestinationEndpoint is the HTTPS URL of the replication receiver service
                  on the destination cluster (e.g., "https://repl-receiver.apps.cluster.example.com").
                  When set, the controller uses driver-to-driver mode instead of direct NFS.
                type: string
              destinationExportPath:
                default: /
                description: |-
                  DestinationExportPath is the NFS export path on the destination server.
                  For VPC access-mode shares, this differentiates shares under a shared FQDN.
                  Defaults to "/" if not specified.
                type: string
              destinationNFSServer:
                description: |-
                  DestinationNFSServer is the NFS mount target IP of the destination pool,
                  reachable over Transit Gateway or VPN.
                  Required for direct NFS mode; omit when using driver-to-driver mode (DestinationEndpoint).
                type: string
              incrementalSync:
                default: true
                description: |-
                  IncrementalSync enables rsync-based incremental replication instead of full copy.
                  When true (default), only changed files are transferred.
                type: boolean
              maxParallelSyncs:
                default: 1
                description: MaxParallelSyncs controls how many SubVolumes are synced
                  concurrently.
                format: int32
                minimum: 1
                type: integer
              maxRetries:
                default: 3
                description: MaxRetries is the number of consecutive failures before
                  the policy is paused.
                format: int32
                minimum: 0
                type: integer
              momentKeepHours:
                description: |-
                  MomentKeepHours keeps earlier moments of volumes that are not VM disks, as
                  folders of hard links next to the destination (in .moments). A file that
                  did not change takes no extra space. A moment older than this many hours is
                  removed after each sync. Unset or 0 keeps none. Needs rsync: it is used
                  even when IncrementalSync is false. BackupPolicy sets this.
                format: int32
                minimum: 0
                type: integer
              postSyncHooks:
                description: PostSyncHooks are hooks executed after each replication
                  sync cycle.
                items:
                  description: Hook defines a pre or post action to execute around
                    snapshot/replication operations.
                  properties:
                    exec:
                      description: |-
                        Exec specifies a command to run in a pod container.
                        Required when type is "exec".
                      properties:
                        command:
                          description: Command is the command and arguments to execute.
                          items:
                            type: string
                          minItems: 1
                          type: array
                        container:
                          description: Container is the container name to exec into.
                            If empty, the first container is used.
                          type: string
                        namespace:
                          description: Namespace is the namespace to search for matching
                            pods.
                          type: string
                        podSelector:
                          additionalProperties:
                            type: string
                          description: PodSelector selects pods by labels. The hook
                            runs in the first matching pod.
                          type: object
                      required:
                      - command
                      - namespace
                      - podSelector
                      type: object
                    http:
                      description: |-
                        HTTP specifies an HTTP endpoint to call.
                        Required when type is "http".
                      properties:
                        headers:
                          additionalProperties:
                            type: string
                          description: Headers are additional HTTP headers to include
                            in the request.
                          type: object
                        method:
                          default: POST
                          description: Method is the HTTP method. Defaults to POST.
                          enum:
                          - GET
                          - POST
                          - PUT
                          type: string
                        url:
                          description: URL is the HTTP endpoint to call.
                          pattern: ^https?://
                          type: string
                      required:
                      - url
                      type: object
                    name:
                      description: Name is a unique identifier for this hook within
                        the hook list.
                      type: string
                    onError:
                      default: Abort
                      description: |-
                        OnError controls behavior when this hook fails.
                        "Continue" proceeds with the operation; "Abort" stops it.
                      enum:
                      - Continue
                      - Abort
                      type: string
                    timeoutSeconds:
                      default: 30
                      description: TimeoutSeconds is the maximum time to wait for
                        the hook to complete.
                      format: int32
                      minimum: 1
                      type: integer
                    type:
                      description: 'Type is the hook execution type: "exec" (pod exec)
                        or "http" (HTTP call).'
                      enum:
                      - exec
                      - http
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              preSyncHooks:
                description: PreSyncHooks are hooks executed before each replication
                  sync cycle.
                items:
                  description: Hook defines a pre or post action to execute around
                    snapshot/replication operations.
                  properties:
                    exec:
                      description: |-
                        Exec specifies a command to run in a pod container.
                        Required when type is "exec".
                      properties:
                        command:
                          description: Command is the command and arguments to execute.
                          items:
                            type: string
                          minItems: 1
                          type: array
                        container:
                          description: Container is the container name to exec into.
                            If empty, the first container is used.
                          type: string
                        namespace:
                          description: Namespace is the namespace to search for matching
                            pods.
                          type: string
                        podSelector:
                          additionalProperties:
                            type: string
                          description: PodSelector selects pods by labels. The hook
                            runs in the first matching pod.
                          type: object
                      required:
                      - command
                      - namespace
                      - podSelector
                      type: object
                    http:
                      description: |-
                        HTTP specifies an HTTP endpoint to call.
                        Required when type is "http".
                      properties:
                        headers:
                          additionalProperties:
                            type: string
                          description: Headers are additional HTTP headers to include
                            in the request.
                          type: object
                        method:
                          default: POST
                          description: Method is the HTTP method. Defaults to POST.
                          enum:
                          - GET
                          - POST
                          - PUT
                          type: string
                        url:
                          description: URL is the HTTP endpoint to call.
                          pattern: ^https?://
                          type: string
                      required:
                      - url
                      type: object
                    name:
                      description: Name is a unique identifier for this hook within
                        the hook list.
                      type: string
                    onError:
                      default: Abort
                      description: |-
                        OnError controls behavior when this hook fails.
                        "Continue" proceeds with the operation; "Abort" stops it.
                      enum:
                      - Continue
                      - Abort
                      type: string
                    timeoutSeconds:
                      default: 30
                      description: TimeoutSeconds is the maximum time to wait for
                        the hook to complete.
                      format: int32
                      minimum: 1
                      type: integer
                    type:
                      description: 'Type is the hook execution type: "exec" (pod exec)
                        or "http" (HTTP call).'
                      enum:
                      - exec
                      - http
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              restorePointKeepHours:
                default: 24
                description: |-
                  RestorePointKeepHours is how long the destination keeps the restore
                  points of running VM disks, so a failover can rewind to an earlier
                  copy. Each restore point holds the old contents of the blocks the next
                  copy changed.
                format: int32
                minimum: 1
                type: integer
              rsyncOptions:
                description: |-
                  RsyncOptions are extra rsync flags appended after the base flags (-a --delete).
                  Dangerous flags (--daemon, --server, --rsh, --rsync-path) are rejected by the webhook.
                  Only applies to direct NFS mode (not driver-to-driver mode).
                items:
                  type: string
                type: array
              schedule:
                description: |-
                  Schedule is a Go duration string controlling replication frequency.
                  Examples: "15m" (every 15 minutes), "1h" (hourly), "6h" (every 6 hours).
                  Parsed as time.Duration.
                type: string
              sourcePoolName:
                description: SourcePoolName is the name of the FileSharePool CR on
                  this cluster to replicate from.
                type: string
              subVolumeSelector:
                description: |-
                  SubVolumeSelector selects which SubVolumes to replicate.
                  If nil, ALL SubVolumes in the source pool are replicated.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              vmCopyAdaptive:
                description: |-
                  VMCopyAdaptive makes the copy start slow and speed up while the share the
                  VM reads is quiet, and slow down when its latency passes
                  VMCopyMaxLatencyMs. Default true. It needs the driver to read the node
                  agents' metrics; without them the copy runs at the fixed speed.
                  See docs/specs/2026-10-26-adaptive-copy-speed.md.
                type: boolean
              vmCopyMaxLatencyMs:
                description: |-
                  VMCopyMaxLatencyMs is the average latency of the share, in milliseconds,
                  above which an adaptive copy slows down. Default 15.
                format: int32
                maximum: 20
                minimum: 1
                type: integer
              vmCopySpeedLimitMBps:
                description: |-
                  VMCopySpeedLimitMBps is the speed of QEMU's copy of each disk of a running
                  VM, in megabytes per second. When the copy adapts (VMCopyAdaptive), it is
                  the highest speed; 0 or unset means there is no highest speed. When the
                  copy does not adapt, it is the fixed speed; 0 means no limit and unset
                  means 20. The limit also counts empty disk space, so a full copy of a
                  large disk takes long at a low speed.
                format: int32
                minimum: 0
                type: integer
            required:
            - destinationBasePath
            - maxRetries
            - schedule
            - sourcePoolName
            type: object
          status:
            description: ReplicationPolicyStatus describes the observed state of a
              replication policy.
            properties:
              conditions:
                description: |-
                  Conditions holds the receiver check. ReceiverReachable is True when the
                  receiver answers, its certificate is trusted and it accepts the token. It is
                  set only for policies in driver-to-driver (receiver) mode. A False result
                  does not stop replication; it explains why a sync fails.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consecutiveFailures:
                description: |-
                  ConsecutiveFailures counts sequential failed replication cycles.
                  Resets to 0 on success.
                format: int32
                type: integer
              lastError:
                description: LastError is the error message from the most recent failure.
                type: string
              lastSyncDuration:
                description: LastSyncDuration is how long the last successful sync
                  took, as a Go duration string.
                type: string
              lastSyncTime:
                description: LastSyncTime is when the last successful replication
                  cycle completed.
                format: date-time
                type: string
              phase:
                description: Phase is the overall replication state.
                enum:
                - Active
                - Paused
                - Failed
                type: string
              subVolumeStatuses:
                description: SubVolumeStatuses tracks per-SubVolume replication state.
                items:
                  description: SubVolumeReplicationStatus tracks the replication state
                    of a single SubVolume.
                  properties:
                    bytesSynced:
                      description: BytesSynced in the last sync for this SubVolume.
                      format: int64
                      type: integer
                    consistency:
                      description: |-
                        Consistency of the last good copy of a running VM's disk.
                        FileSystemConsistent means the guest file systems were frozen;
                        CrashConsistent means they were not, as after a power loss.
                      enum:
                      - FileSystemConsistent
                      - CrashConsistent
                      type: string
                    consistencyReason:
                      description: ConsistencyReason says why a copy is only crash
                        consistent.
                      type: string
                    copyMoment:
                      description: |-
                        CopyMoment is the moment the last good copy of a running VM's disk
                        shows. All disks of the VM in this policy show the same moment.
                      format: date-time
                      type: string
                    lastError:
                      description: LastError recorded for this SubVolume's last sync
                        attempt.
                      type: string
                    lastSyncTime:
                      description: LastSyncTime for this specific SubVolume.
                      format: date-time
                      type: string
                    oldestRestorePoint:
                      format: date-time
                      type: string
                    restorePoints:
                      description: |-
                        RestorePoints is how many earlier copies of a running VM's disk the
                        destination keeps, and OldestRestorePoint the moment of the oldest.
                      format: int32
                      type: integer
                    subVolumeName:
                      description: SubVolumeName is the SubVolume CR name.
                      type: string
                    vmChangeList:
                      description: |-
                        VMChangeList is the change list (QEMU dirty bitmap) of the last good
                        copy of a running VM's disk. The next copy holds only the blocks
                        changed since then. Empty means the next copy is a full copy.
                      type: string
                    vmCopy:
                      description: |-
                        VMCopy is the state of a running VM disk copy that is not finished.
                        The controller uses it to continue the copy across cycles and restarts.
                      properties:
                        base:
                          type: string
                        bitmap:
                          description: |-
                            Bitmap is the change list this copy started. Base is the change list it
                            read, for a change copy; Incremental is true then.
                          type: string
                        diskIndex:
                          format: int32
                          type: integer
                        fileSystemConsistent:
                          description: FileSystemConsistent is true if the guest was
                            frozen for the copy.
                          type: boolean
                        freezeError:
                          description: FreezeError is the freeze error, if the freeze
                            failed.
                          type: string
                        id:
                          description: ID names the copy. It is the same for all disks
                            of one VM copy.
                          type: string
                        incremental:
                          type: boolean
                        leader:
                          description: |-
                            Leader names the Snapshot that owns the QEMU copy, when this Snapshot
                            joined a copy that another Snapshot of the same VM started. It is empty
                            on the owner. Only a snapshot copy sets it.
                          type: string
                        moment:
                          description: Moment is the moment the copy shows.
                          format: date-time
                          type: string
                        phase:
                          description: |-
                            Phase is Copying while QEMU writes the staging file, and Sending while
                            a Job applies it at the destination.
                          enum:
                          - Copying
                          - Sending
                          type: string
                        podName:
                          description: |-
                            PodName and PodUID identify the virt-launcher pod. If the pod changes,
                            the VM restarted or moved and QEMU no longer has the copy.
                          type: string
                        podNamespace:
                          description: |-
                            PodNamespace is the namespace of the VM pod. A snapshot copy sets it so
                            the copy can be watched and cancelled without its source volume.
                          type: string
                        podUID:
                          type: string
                        setDisks:
                          description: |-
                            SetDisks lists every disk of the QEMU copy, in the order QEMU numbered
                            them. Only a snapshot copy sets it, on the owner and on joined Snapshots.
                          items:
                            description: VMCopyDisk is one disk of a QEMU copy that
                              covers several disks of a VM.
                            properties:
                              stagingFile:
                                description: StagingFile is the staging file name
                                  in the volume's root directory.
                                type: string
                              volume:
                                description: Volume is the pod volume name of the
                                  disk.
                                type: string
                            required:
                            - stagingFile
                            - volume
                            type: object
                          type: array
                        speedMBps:
                          description: |-
                            SpeedMBps is the speed limit of the copy of each disk now, in megabytes
                            per second. 0 means no limit. An adaptive copy changes it.
                          format: int32
                          type: integer
                        stagingFile:
                          description: StagingFile is the staging file name in the
                            volume's root directory.
                          type: string
                        vmiName:
                          description: VMIName is the VirtualMachineInstance name.
                          type: string
                        volume:
                          description: |-
                            Volume is the pod volume name of this disk, and DiskIndex its place in
                            the copy.
                          type: string
                      required:
                      - bitmap
                      - diskIndex
                      - fileSystemConsistent
                      - id
                      - moment
                      - phase
                      - podName
                      - podUID
                      - stagingFile
                      - vmiName
                      - volume
                      type: object
                  required:
                  - subVolumeName
                  type: object
                type: array
            required:
            - consecutiveFailures
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
